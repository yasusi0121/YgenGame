<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="あそびば" />
  <title>ちいく あそびば — LOGIC BOOK</title>
  <style>
    :root {
      --font-rounded: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "BIZ UDGothic", "Rounded Mplus 1c", "Arial Rounded MT Bold", ui-rounded, system-ui, -apple-system, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      font-family: var(--font-rounded);
      background: #FFF8EC;
      color: #2D3436;
      overscroll-behavior: none;
    }

    /* Ruby styling (clean hiragana furigana) */
    ruby {
      ruby-align: center;
      ruby-position: over;
    }
    rt {
      font-size: 0.42em;
      font-weight: 800;
      letter-spacing: 0.06em;
      opacity: 0.92;
      line-height: 1.2;
    }

    /* App Container */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* ============================================================
       HOME MENU SCREEN (Lingokids-inspired Flat Toy Design)
       ============================================================ */
    #home-screen {
      background: #FFF7E8;
      padding: calc(18px + var(--safe-top)) calc(24px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(24px + var(--safe-left));
      justify-content: space-between;
      align-items: center;
    }

    .home-bg-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
    }
    .bg-blob-1 { width: 340px; height: 340px; background: #FFE29A; top: -110px; left: -90px; }
    .bg-blob-2 { width: 280px; height: 280px; background: #B8E8FC; top: -60px; right: -70px; }
    .bg-blob-3 { width: 320px; height: 320px; background: #FFD1DC; bottom: -120px; left: 15%; }
    .bg-blob-4 { width: 260px; height: 260px; background: #C8F2D6; bottom: -90px; right: 8%; }

    .home-header {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1060px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #FFFFFF;
      padding: 10px 22px 10px 14px;
      border-radius: 999px;
      border: 4px solid #FFE2B3;
      box-shadow: 0 6px 0 #F2D29B;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FF7043;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 #D84315;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 900;
      color: #2D3436;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .brand-sub {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #FF7043;
      letter-spacing: 0.06em;
    }

    /* Flat Toy Icon Button (Sound / Back / etc.) */
    .toy-icon-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: #FFFFFF;
      color: #2D3436;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .toy-icon-btn:active,
    .toy-icon-btn.is-pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
    }

    .toy-icon-btn.is-muted {
      background: #E2E8F0;
      color: #64748B;
    }

    /* Menu Main Area */
    .home-main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1060px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(14px, 2.2vh, 26px);
      padding: 12px 0;
    }

    .home-prompt {
      margin: 0;
      font-size: clamp(20px, 2.6vw, 30px);
      font-weight: 900;
      color: #3D405B;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 28px;
      border-radius: 999px;
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 0 rgba(61, 64, 91, 0.08);
      flex-shrink: 0;
    }

    .game-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(16px, 2.4vw, 28px);
      align-items: stretch;
    }

    /* iPad Portrait (e.g. 768x1024): Featured card full-width on top, 2 cards below */
    @media (max-width: 860px) and (orientation: portrait) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 680px;
      }
      .game-grid .game-card:first-child {
        grid-column: 1 / -1;
      }
    }

    /* Phone Portrait: single column with smooth vertical scroll */
    @media (max-width: 600px) {
      .home-main {
        justify-content: flex-start;
      }
      .game-grid {
        grid-template-columns: 1fr;
        max-width: 420px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        padding: 4px 6px 24px;
      }
      .game-grid .game-card:first-child {
        grid-column: auto;
      }
    }

    .noscript-banner {
      background: #FFFFFF;
      color: #C0392B;
      border: 4px solid #FFCDD2;
      border-radius: 24px;
      padding: 20px 26px;
      max-width: 520px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.6;
      box-shadow: 0 8px 0 rgba(192, 57, 43, 0.12);
    }

    .game-card {
      position: relative;
      border: 5px solid #FFFFFF;
      border-radius: 32px;
      padding: clamp(18px, 2.4vw, 26px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 14px;
      cursor: pointer;
      color: #FFFFFF;
      background: var(--card-bg, #FF7043);
      box-shadow: 0 10px 0 var(--card-shadow, #D84315), 0 16px 28px rgba(45, 52, 54, 0.12);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
      min-height: clamp(240px, 38vh, 330px);
    }

    .game-card:active,
    .game-card.is-pressed {
      transform: translateY(7px) scale(0.98);
      box-shadow: 0 3px 0 var(--card-shadow, #D84315), 0 6px 12px rgba(45, 52, 54, 0.10);
    }

    .game-card.is-coming-soon {
      background: var(--card-bg, #A5B4FC);
      color: #FFFFFF;
      opacity: 0.94;
    }

    .game-card.is-boing {
      animation: cardBoing 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardBoing {
      0% { transform: scale(1); }
      30% { transform: scale(1.06, 0.93); }
      55% { transform: scale(0.96, 1.04); }
      80% { transform: scale(1.02, 0.98); }
      100% { transform: scale(1); }
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: #FFD12E;
      color: #5C3D00;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #D9A700;
      letter-spacing: 0.04em;
    }

    .game-card.is-coming-soon .card-badge {
      background: #FFFFFF;
      color: #5B6770;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    }

    .card-icon-wrap {
      width: clamp(92px, 12vw, 126px);
      height: clamp(92px, 12vw, 126px);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
      margin-top: 10px;
    }

    .card-title {
      margin: 0;
      font-size: clamp(22px, 2.5vw, 30px);
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .card-title rt {
      font-size: 0.48em;
      color: rgba(255, 255, 255, 0.95);
    }

    .card-desc {
      margin: 0;
      font-size: clamp(13px, 1.5vw, 16px);
      font-weight: 800;
      opacity: 0.92;
      line-height: 1.4;
    }

    .card-play-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      color: var(--card-shadow, #D84315);
      font-size: clamp(15px, 1.7vw, 18px);
      font-weight: 900;
      padding: 10px 26px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.14);
    }

    .game-card.is-coming-soon .card-play-pill {
      background: rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      box-shadow: none;
    }

    .home-footer {
      position: relative;
      z-index: 2;
      font-size: 13px;
      font-weight: 800;
      color: #7F8C8D;
      text-align: center;
    }

    /* ============================================================
       GAME SHELL SCREEN (Shared Chrome for All Games)
       ============================================================ */
    #game-screen {
      background: #EB5A3C;
      transition: background-color 0.42s ease, opacity 0.35s ease, transform 0.35s ease;
    }

    .game-topbar {
      position: absolute;
      top: calc(14px + var(--safe-top));
      left: calc(18px + var(--safe-left));
      right: calc(18px + var(--safe-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      pointer-events: none;
    }

    .game-topbar > * {
      pointer-events: auto;
    }

    /* Single-tap Close (X) button */
    .close-game-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      color: #2D3436;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.16);
      padding: 0;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .close-game-btn:active,
    .close-game-btn.is-pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
    }

    #game-mount {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ============================================================
       GAME 1: LOGIC BOOK (Computer Engineering for Babies)
       ============================================================ */
    .lb-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + var(--safe-top)) calc(20px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(20px + var(--safe-left));
      overflow: hidden;
    }

    /* Optional flat PCB background pattern for XOR & LATCH */
    .lb-pcb-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .lb-pcb-bg.is-visible {
      opacity: 1;
    }

    /* Stage Header Badge (Center Top) */
    .lb-stage-header {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      pointer-events: none;
    }

    .lb-stage-pill {
      background: rgba(255, 255, 255, 0.22);
      border: 3px solid rgba(255, 255, 255, 0.45);
      color: #FFFFFF;
      font-size: clamp(13px, 1.6vw, 16px);
      font-weight: 900;
      padding: 5px 18px;
      border-radius: 999px;
      letter-spacing: 0.06em;
    }

    .lb-root.is-light-bg .lb-stage-pill {
      background: rgba(45, 52, 54, 0.12);
      border-color: rgba(45, 52, 54, 0.22);
      color: #3B2E00;
    }

    /* Main Interactive Board Stage (Fixed Aspect Ratio so SVG wires, buttons, LED never drift) */
    .lb-stage-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .lb-board {
      position: relative;
      width: min(92vw, 940px, calc(66dvh * 1.85));
      aspect-ratio: 900 / 480;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }

    .lb-board.slide-out-left {
      transform: translateX(-50px) scale(0.96);
      opacity: 0;
    }
    .lb-board.slide-out-right {
      transform: translateX(50px) scale(0.96);
      opacity: 0;
    }

    .lb-circuit-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* SVG Wire Styles */
    .wire-base {
      fill: none;
      stroke: rgba(255, 255, 255, 0.42);
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .lb-root.is-light-bg .wire-base {
      stroke: rgba(59, 46, 0, 0.28);
    }

    .wire-power {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.14s ease;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
    }

    .wire-power.is-on {
      opacity: 1;
    }

    .wire-pulse {
      fill: none;
      stroke: #FFF7A8;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 14 26;
      opacity: 0;
      transition: opacity 0.14s ease;
      animation: wireFlow 0.75s linear infinite;
    }

    .wire-pulse.is-on {
      opacity: 1;
    }

    @keyframes wireFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }

    /* Gate shapes */
    .gate-body {
      fill: rgba(255, 255, 255, 0.18);
      stroke: #FFFFFF;
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.18s ease, filter 0.18s ease;
    }

    .lb-root.is-light-bg .gate-body {
      fill: rgba(255, 255, 255, 0.48);
      stroke: #3B2E00;
    }

    .gate-body.is-active {
      fill: rgba(255, 255, 255, 0.55);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.75));
    }

    .lb-root.is-light-bg .gate-body.is-active {
      fill: #FFFFFF;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95));
    }

    .gnd-line {
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .lb-root.is-light-bg .gnd-line {
      stroke: #3B2E00;
    }

    /* Tactile 3D-Flat Toy Push Button */
    .toy-push-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 17.5%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 1.1%;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2), 0 16px 24px rgba(0, 0, 0, 0.16);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      z-index: 12;
    }

    .toy-push-btn-well {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--btn-well, #B58900);
      display: grid;
      place-items: center;
    }

    .toy-push-btn-cap {
      position: relative;
      width: 92%;
      height: 92%;
      border-radius: 50%;
      background: var(--btn-color, #FFD12E);
      box-shadow: 0 10px 0 var(--btn-depth, #D99B00), inset 0 -4px 0 rgba(0, 0, 0, 0.08);
      transform: translateY(-6px);
      transition: transform 0.07s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.07s ease, filter 0.1s ease;
      display: grid;
      place-items: center;
    }

    /* Flat glossy highlight on button cap */
    .toy-push-btn-cap::before {
      content: "";
      position: absolute;
      top: 13%;
      left: 19%;
      width: 30%;
      height: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-28deg);
      pointer-events: none;
    }

    .toy-push-btn.is-pressed .toy-push-btn-cap {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 2px 0 var(--btn-depth, #D99B00), inset 0 2px 0 rgba(0, 0, 0, 0.1);
      filter: brightness(1.06);
    }

    .toy-push-btn.btn-yellow {
      --btn-color: #FFD230;
      --btn-depth: #D69600;
      --btn-well: #9E6E00;
    }

    .toy-push-btn.btn-red {
      --btn-color: #FF4747;
      --btn-depth: #C81E2B;
      --btn-well: #8C131C;
    }

    /* Ripple effect on button press */
    .btn-ripple {
      position: absolute;
      inset: -14%;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.85);
      opacity: 0;
      pointer-events: none;
    }

    .toy-push-btn.is-pressed .btn-ripple {
      animation: btnRippleOut 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes btnRippleOut {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    /* Button Side Label (for LATCH: RESET / SET) */
    .btn-side-label {
      position: absolute;
      transform: translate(-100%, -50%);
      padding-right: 14px;
      text-align: right;
      color: #FFFFFF;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 22px);
      line-height: 1.2;
      letter-spacing: 0.05em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 11;
    }

    .btn-side-label rt {
      font-size: 0.56em;
      color: rgba(255, 255, 255, 0.88);
    }

    /* LED Lamp Component */
    .toy-led {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 11.2%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 0.95%;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.22);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 12;
    }

    .toy-led-bulb {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--led-off, #3B4252);
      transition: background 0.12s ease, box-shadow 0.16s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toy-led-bulb::before {
      content: "";
      position: absolute;
      top: 16%;
      left: 20%;
      width: 28%;
      height: 20%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(-25deg);
    }

    .toy-led.is-on .toy-led-bulb {
      background: var(--led-on, #4ADE80);
      transform: scale(1.08);
      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.45),
        0 0 28px 10px var(--led-glow, rgba(74, 222, 128, 0.9)),
        0 0 58px 20px var(--led-glow, rgba(74, 222, 128, 0.55));
    }

    /* Sparkle Rays around LED when ON */
    .led-sparkles {
      position: absolute;
      inset: -55%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5) rotate(-15deg);
      transition: opacity 0.18s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toy-led.is-on .led-sparkles {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: sparkleFloat 2.2s ease-in-out infinite;
    }

    @keyframes sparkleFloat {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.09) rotate(8deg); }
    }

    /* Big Title & Furigana below circuit */
    .lb-title-area {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 4px;
      pointer-events: none;
      margin-top: 6px;
      padding: 0 64px;
    }

    .lb-circuit-name {
      margin: 0;
      font-size: clamp(30px, 4.8vw, 54px);
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.1em;
      line-height: 1.22;

  <script>
    (() => {
      'use strict';

      /* =========================================================================
         1. HIGH-QUALITY WEB AUDIO SOUND ENGINE
            (Tactile toy clicks + warm marimba/kalimba harmonics + room reverb)
         ========================================================================= */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.dryBus = null;
          this.wetBus = null;
          this.noiseBuffer = null;
          this.muted = false;
          this.unlocked = false;
        }

        ensureContext() {
          if (this.ctx) {
            if (this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return this.ctx;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;

          const ctx = new AudioCtx();
          this.ctx = ctx;

          // Master dynamics compressor for warm, clean, non-clipping output
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 18;
          comp.ratio.value = 4;
          comp.attack.value = 0.005;
          comp.release.value = 0.16;

          const master = ctx.createGain();
          master.gain.value = this.muted ? 0 : 0.9;

          const dryBus = ctx.createGain();
          dryBus.gain.value = 0.85;

          const wetBus = ctx.createGain();
          wetBus.gain.value = 0.28;

          // Procedural warm studio room reverb (impulse response)
          const convolver = ctx.createConvolver();
          convolver.buffer = this.createReverbIR(ctx, 1.15, 2.8);

          dryBus.connect(comp);
          wetBus.connect(convolver);
          convolver.connect(comp);
          comp.connect(master);
          master.connect(ctx.destination);

          this.master = master;
          this.dryBus = dryBus;
          this.wetBus = wetBus;
          this.noiseBuffer = this.createNoiseBuffer(ctx, 0.5);

          return ctx;
        }

        unlock() {
          const ctx = this.ensureContext();
          if (!ctx || this.unlocked) return;
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          // Play 1-sample silent buffer to unlock iOS Safari audio
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          try {
            src.start(0);
            this.unlocked = true;
          } catch (_) {}
        }

        createNoiseBuffer(ctx, durationSec) {
          const length = Math.floor(ctx.sampleRate * durationSec);
          const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buffer;
        }

        createReverbIR(ctx, durationSec, decay) {
          const rate = ctx.sampleRate;
          const length = Math.floor(rate * durationSec);
          const ir = ctx.createBuffer(2, length, rate);
          for (let ch = 0; ch < 2; ch++) {
            const data = ir.getChannelData(ch);
            let lp = 0;
            for (let i = 0; i < length; i++) {
              const t = i / length;
              const env = Math.pow(1 - t, decay);
              // Gentle low-pass smoothing for warm wooden room feel
              const white = Math.random() * 2 - 1;
              lp = lp * 0.72 + white * 0.28;
              data[i] = lp * env;
            }
          }
          return ir;
        }

        setMuted(muted) {
          this.muted = muted;
          if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(muted ? 0 : 0.9, this.ctx.currentTime, 0.02);
          }
        }

        toggleMute() {
          this.setMuted(!this.muted);
          return this.muted;
        }

        /** Warm Marimba / Kalimba single note with rich overtones */
        playMarimbaNote(freq, startTime, duration = 0.55, volume = 0.24, brightness = 1.0) {
          const ctx = this.ctx;
          if (!ctx || this.muted) return;

          const out = ctx.createGain();
          out.gain.setValueAtTime(0.0001, startTime);
          out.gain.linearRampToValueAtTime(volume, startTime + 0.008);
          out.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          // Fundamental (warm triangle + sine blend)
          const osc1 = ctx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, startTime);

          const osc1b = ctx.createOscillator();
          osc1b.type = 'triangle';
          osc1b.frequency.setValueAtTime(freq * 1.002, startTime); // subtle warmth detune
          const g1b = ctx.createGain();
          g1b.gain.value = 0.35;

          // 2nd harmonic (soft wooden body)
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2, startTime);
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.18 * brightness, startTime);
          g2.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.45);

          // 4th harmonic (mallet strike ping)
          const osc4 = ctx.createOscillator();
          osc4.type = 'sine';
          osc4.frequency.setValueAtTime(freq * 4, startTime);
          const g4 = ctx.createGain();
          g4.gain.setValueAtTime(0.09 * brightness, startTime);
          g4.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.07);

          osc1.connect(out);
          osc1b.connect(g1b); g1b.connect(out);
          osc2.connect(g2);   g2.connect(out);
          osc4.connect(g4);   g4.connect(out);

          out.connect(this.dryBus);
          out.connect(this.wetBus);

          [osc1, osc1b, osc2, osc4].forEach(osc => {
            osc.start(startTime);
            osc.stop(startTime + duration + 0.04);
          });
        }

        /** Tactile toy push button DOWN sound (plastic click + resonant body thump) */
        playButtonDown(variant = 'yellow') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // 1. Crisp micro-switch click (bandpass filtered noise burst)
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(variant === 'red' ? 2100 : 2500, now);
          bp.Q.value = 2.4;

          const clickGain = ctx.createGain();
          clickGain.gain.setValueAtTime(0.28, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);

          noise.connect(bp);
          bp.connect(clickGain);
          clickGain.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.03);

          // 2. Soft hollow plastic pop (pitched sine drop)
          const pop = ctx.createOscillator();
          pop.type = 'sine';
          const baseFreq = variant === 'red' ? 185 : 225;
          pop.frequency.setValueAtTime(baseFreq, now);
          pop.frequency.exponentialRampToValueAtTime(baseFreq * 0.44, now + 0.055);

          const popGain = ctx.createGain();
          popGain.gain.setValueAtTime(0.26, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          pop.connect(popGain);
          popGain.connect(this.dryBus);
          pop.start(now);
          pop.stop(now + 0.07);
        }

        /** Tactile toy push button UP (release) sound */
        playButtonUp(variant = 'yellow') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          const startFreq = variant === 'red' ? 240 : 285;
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(startFreq * 1.32, now + 0.032);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.038);

          osc.connect(g);
          g.connect(this.dryBus);
          osc.start(now);
          osc.stop(now + 0.045);
        }

        /** Lamp ON harmonic celebration tailored per circuit stage (C major pentatonic) */
        playLampOn(stageId) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Musical chord voicings (all consonant in C major pentatonic)
          const chords = {
            wire:  [523.25, 783.99],                   // C5, G5
            not:   [587.33, 880.00],                   // D5, A5
            or:    [659.25, 783.99, 1046.50],          // E5, G5, C6
            and:   [523.25, 659.25, 783.99, 1046.50],  // C5, E5, G5, C6 (big reward!)
            xor:   [440.00, 659.25, 880.00],           // A4, E5, A5
            latch: [523.25, 659.25, 783.99, 1174.66],  // C5, E5, G5, D6 (magical harp)
          };

          const notes = chords[stageId] || chords.wire;
          const step = stageId === 'latch' ? 0.055 : (stageId === 'and' ? 0.038 : 0.025);
          const dur = stageId === 'latch' ? 0.9 : 0.62;
          const vol = 0.21 / Math.sqrt(notes.length * 0.65);

          notes.forEach((freq, i) => {
            this.playMarimbaNote(freq, now + i * step, dur, vol, stageId === 'and' ? 1.3 : 1.0);
          });
        }

        /** Lamp OFF gentle rounded sound */
        playLampOff(isLatchReset = false) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          if (isLatchReset) {
            // Soft downward 2-note release for LATCH RESET
            this.playMarimbaNote(587.33, now, 0.26, 0.14, 0.5);
            this.playMarimbaNote(392.00, now + 0.065, 0.36, 0.16, 0.45);
          } else {
            // Subtle muted wooden drop
            this.playMarimbaNote(392.00, now, 0.2, 0.08, 0.35);
          }
        }

        /** Page turn sound (gentle paper whoosh + soft woodblock) */
        playPageTurn(direction = 1) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Soft paper sweep
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(direction > 0 ? 700 : 1200, now);
          filter.frequency.exponentialRampToValueAtTime(direction > 0 ? 1500 : 650, now + 0.12);
          filter.Q.value = 1.2;

          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.001, now);
          ng.gain.linearRampToValueAtTime(0.11, now + 0.03);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          noise.connect(filter);
          filter.connect(ng);
          ng.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.16);

          // Light woodblock tap
          const pitch = direction > 0 ? 659.25 : 523.25;
          this.playMarimbaNote(pitch, now + 0.02, 0.18, 0.14, 0.7);
        }

        /** Menu launch chime */
        playMenuSelect() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((f, i) => {
            this.playMarimbaNote(f, now + i * 0.055, 0.42, 0.19, 1.1);
          });
        }

        /** Playful boing for Coming Soon cards */
        playBoing() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(460, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.2);
          osc.frequency.exponentialRampToValueAtTime(410, now + 0.28);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.22, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

          osc.connect(g);
          g.connect(this.dryBus);
          g.connect(this.wetBus);
          osc.start(now);
          osc.stop(now + 0.36);
        }

        /** Tactile mechanical rocker switch snap (ON = brighter snap, OFF = deeper clack) */
        playRockerSwitch(isOn, variant = 'red') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Crisp double-click plastic snap
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(isOn ? 2800 : 1850, now);
          bp.Q.value = 3.0;

          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.32, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

          noise.connect(bp);
          bp.connect(ng);
          ng.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.032);

          // Resonant rocker body clack
          const body = ctx.createOscillator();
          body.type = 'triangle';
          const startF = isOn ? (variant === 'red' ? 310 : 350) : (variant === 'red' ? 230 : 260);
          const endF = isOn ? startF * 1.45 : startF * 0.62;
          body.frequency.setValueAtTime(startF, now);
          body.frequency.exponentialRampToValueAtTime(endF, now + 0.048);

          const bg = ctx.createGain();
          bg.gain.setValueAtTime(0.22, now);
          bg.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

          body.connect(bg);
          bg.connect(this.dryBus);
          body.start(now);
          body.stop(now + 0.06);
        }

        /** Shift register step chime (scales nicely with lit bits) */
        playShiftStep(litCount = 1) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const scale = [392.0, 523.25, 659.25, 783.99, 1046.5];
          const freq = scale[Math.min(scale.length - 1, Math.max(0, litCount))];
          this.playMarimbaNote(freq, now, 0.34, 0.2, 1.05);
        }

        /** Decoder / Mux selection pitch (4 distinct pentatonic notes for 0..3) */
        playSlotTone(slotIndex) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const tones = [523.25, 587.33, 659.25, 783.99]; // C5, D5, E5, G5
          const f = tones[slotIndex % 4];
          this.playMarimbaNote(f, now, 0.45, 0.2, 1.0);
        }

        /** Memory write confirmation chime */
        playMemoryWrite(isOn) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          if (isOn) {
            this.playMarimbaNote(659.25, now, 0.35, 0.2, 1.15);
            this.playMarimbaNote(987.77, now + 0.05, 0.5, 0.2, 1.2);
          } else {
            this.playMarimbaNote(523.25, now, 0.28, 0.16, 0.65);
            this.playMarimbaNote(392.00, now + 0.055, 0.36, 0.16, 0.55);
          }
        }
      }

                    <polyline points="9 18 15 12 9 6"/>

          this.rootEl = this.container.querySelector('#lb-root');
          this.pcbEl = this.container.querySelector('.lb-pcb-bg');
          this.boardEl = this.container.querySelector('#lb-board');
          this.counterEl = this.container.querySelector('#lb-page-counter');
          this.nameEl = this.container.querySelector('#lb-circuit-name');
          this.tipEl = this.container.querySelector('#lb-circuit-tip');
          this.prevBtn = this.container.querySelector('#lb-prev-btn');
          this.nextBtn = this.container.querySelector('#lb-next-btn');
          this.dotsEl = this.container.querySelector('#lb-dots');

          this.buildDots();

          this.prevBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.goToStage(this.stageIndex - 1, -1);
          });

          this.nextBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.goToStage(this.stageIndex + 1, 1);
          });

          window.addEventListener('keydown', this.onKeyDown);
          window.addEventListener('keyup', this.onKeyUp);

          this.renderStage(0, false);
        }

        unmount() {
          window.removeEventListener('keydown', this.onKeyDown);
          window.removeEventListener('keyup', this.onKeyUp);
          this.pointerMap.clear();
          this.container.innerHTML = '';
        }

        buildDots() {
          this.dotsEl.innerHTML = '';
          LOGIC_STAGES.forEach((st, idx) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'lb-dot';
            dot.setAttribute('aria-label', `${st.ruby} ページへ`);
            dot.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              if (idx !== this.stageIndex) {
                this.goToStage(idx, idx > this.stageIndex ? 1 : -1);
              }
            });
            this.dotsEl.appendChild(dot);
          });
        }

        goToStage(nextIndex, direction) {
          if (this.isTransitioning) return;
          if (nextIndex < 0 || nextIndex >= LOGIC_STAGES.length) return;

          this.isTransitioning = true;
          this.sound.playPageTurn(direction);
          this.boardEl.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');

          setTimeout(() => {
            this.renderStage(nextIndex, true);
            this.boardEl.classList.remove('slide-out-left', 'slide-out-right');
            this.isTransitioning = false;
          }, 190);
        }

        renderStage(index, playNotInitSound = false) {
          this.stageIndex = index;
          const stage = LOGIC_STAGES[index];

          // Reset transient state
          this.pressed = {};
          this.memory = { latched: false };
          this.pointerMap.clear();

          // Update shell & theme
          this.app.setGameBackground(stage.bg);
          this.rootEl.classList.toggle('is-light-bg', !!stage.lightBg);
          this.pcbEl.classList.toggle('is-visible', !!stage.pcb);

          this.counterEl.textContent = `${index + 1} / ${LOGIC_STAGES.length}`;
          this.nameEl.innerHTML = `<ruby>${stage.name}<rt>${stage.ruby}</rt></ruby>`;
          this.tipEl.textContent = stage.tip;

          this.prevBtn.classList.toggle('is-disabled', index === 0);
          this.nextBtn.classList.toggle('is-disabled', index === LOGIC_STAGES.length - 1);

          Array.from(this.dotsEl.children).forEach((dot, i) => {
            dot.classList.toggle('is-active', i === index);
          });

          // Build interactive board HTML (SVG wires + tactile HTML buttons + LED)
          let buttonsHtml = '';
          stage.buttons.forEach((btn) => {
            const leftPct = (btn.x / 900) * 100;
            const topPct = (btn.y / 480) * 100;
            if (btn.label) {
              const labelLeftPct = ((btn.x - 86) / 900) * 100;
              buttonsHtml += `
                <div class="btn-side-label" style="left:${labelLeftPct}%; top:${topPct}%;">
                  <ruby>${btn.label}<rt>${btn.labelRuby}</rt></ruby>
                </div>
              `;
            }
            buttonsHtml += `
              <div class="toy-push-btn btn-${btn.color}"
                   data-btn-id="${btn.id}"
                   data-btn-color="${btn.color}"
                   style="left:${leftPct}%; top:${topPct}%;"
                   role="button"
                   aria-label="${btn.color === 'red' ? 'あかい ぼたん' : 'きいろい ぼたん'}">
                <div class="btn-ripple"></div>
                <div class="toy-push-btn-well">
                  <div class="toy-push-btn-cap"></div>
                </div>
              </div>
            `;
          });

          const ledLeftPct = (stage.led.x / 900) * 100;
          const ledTopPct = (stage.led.y / 480) * 100;

          this.boardEl.innerHTML = `
            <svg class="lb-circuit-svg" viewBox="0 0 900 480" aria-hidden="true">
              ${stage.renderCircuitSvg()}

            <div class="toy-led" id="lb-led"

                </g>

              <div class="toy-led-bulb"></div>
            </div>

          this.bindButtonEvents();

          // Evaluate initial state silently (so NOT starts lit without extra noise unless desired)
          const initial = stage.evalState(this.pressed, this.memory);
          this.lastLedOn = initial.led;
          this.applyVisualState(initial);

          if (playNotInitSound && stage.id === 'not') {
            setTimeout(() => {
              if (this.stageIndex === index && this.lastLedOn) {
                this.sound.playLampOn('not');
              }
            }, 140);
          }
        }

        bindButtonEvents() {
          const btnEls = this.boardEl.querySelectorAll('.toy-push-btn');
          btnEls.forEach((el) => {
            const btnId = el.dataset.btnId;
            const color = el.dataset.btnColor;
            const activePointers = new Set();

            const updateBtnPressed = () => {
              const isDown = activePointers.size > 0;
              const wasDown = !!this.pressed[btnId];
              if (isDown === wasDown) return;

              this.pressed[btnId] = isDown;
              el.classList.toggle('is-pressed', isDown);

              if (isDown) {
                this.sound.playButtonDown(color);
              } else {
                this.sound.playButtonUp(color);
              }
              this.evaluateAndRender();
            };

            el.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              try { el.setPointerCapture(e.pointerId); } catch (_) {}
              activePointers.add(e.pointerId);
              this.pointerMap.set(e.pointerId, btnId);
              updateBtnPressed();
            });

            const releasePointer = (e) => {
              if (!activePointers.has(e.pointerId)) return;
              activePointers.delete(e.pointerId);
              this.pointerMap.delete(e.pointerId);
              updateBtnPressed();
            };

            el.addEventListener('pointerup', releasePointer);
            el.addEventListener('pointercancel', releasePointer);
            el.addEventListener('lostpointercapture', releasePointer);
          });
        }

        /* Optional keyboard support for desktop testing (1 = red, 2 = yellow, arrows = pages) */
        handleKeyDown(e) {
          if (e.repeat) return;
          if (e.key === 'ArrowRight') {
            this.goToStage(this.stageIndex + 1, 1);
            return;
          }
          if (e.key === 'ArrowLeft') {
            this.goToStage(this.stageIndex - 1, -1);
            return;
          }
          const btnId = e.key === '1' ? 'r' : (e.key === '2' || e.key === ' ' ? 'y' : null);
          if (!btnId) return;
          const btnEl = this.boardEl.querySelector(`.toy-push-btn[data-btn-id="${btnId}"]`);
          if (!btnEl || this.pressed[btnId]) return;
          this.sound.unlock();
          this.pressed[btnId] = true;
          btnEl.classList.add('is-pressed');
          this.sound.playButtonDown(btnEl.dataset.btnColor);
          this.evaluateAndRender();
        }

        handleKeyUp(e) {
          const btnId = e.key === '1' ? 'r' : (e.key === '2' || e.key === ' ' ? 'y' : null);
          if (!btnId) return;
          const btnEl = this.boardEl.querySelector(`.toy-push-btn[data-btn-id="${btnId}"]`);
          if (!btnEl || !this.pressed[btnId]) return;
          this.pressed[btnId] = false;
          btnEl.classList.remove('is-pressed');
          this.sound.playButtonUp(btnEl.dataset.btnColor);
          this.evaluateAndRender();
        }

        evaluateAndRender() {
          const stage = LOGIC_STAGES[this.stageIndex];
          const state = stage.evalState(this.pressed, this.memory);
          this.applyVisualState(state);

          if (state.led !== this.lastLedOn) {
            if (state.led) {
              this.sound.playLampOn(stage.id);
            } else {
              this.sound.playLampOff(stage.id === 'latch');
            }
            this.lastLedOn = state.led;
          }
        }

        applyVisualState(state) {
          const ledEl = this.boardEl.querySelector('#lb-led');
          if (ledEl) {
            ledEl.classList.toggle('is-on', !!state.led);
          }

          Object.entries(state.wires).forEach(([wireId, isOn]) => {
            const group = this.boardEl.querySelector(`.wire-group[data-wire="${wireId}"]`);
            if (!group) return;
            group.querySelectorAll('.wire-power, .wire-pulse').forEach((path) => {
              path.classList.toggle('is-on', !!isOn);

          });

          Object.entries(state.gates).forEach(([gateId, isActive]) => {
            const group = this.boardEl.querySelector(`[data-gate="${gateId}"]`);
            if (!group) return;
            group.querySelectorAll('.gate-body').forEach((shape) => {
              shape.classList.toggle('is-active', !!isActive);
            });
          });
        }

      class BigBabiesGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.stageIndex = 0;
          this.sw = { r: false, y: false };
          this.dLatchQ = false;
          this.shiftBits = [false, false, false];
          this.muxInputs = [false, true, false, true];
          this.sharedMemory = [true, false, true, false];
          this.clkFlash = false;
          this.lastSoundKey = null;
          this.isTransitioning = false;
          this.onKeyDown = this.handleKeyDown.bind(this);
        }

        mount() {
          this.container.innerHTML = `
            <div class="lb-root" id="bb-root">
              ${renderPcbPatternSvg()}

              <div class="lb-stage-header">
                <div class="lb-stage-pill" id="bb-page-counter">1 / 6</div>
              </div>

              <div class="lb-title-area">
                <h2 class="lb-circuit-name" id="bb-circuit-name"></h2>
                <p class="lb-circuit-tip" id="bb-circuit-tip"></p>
              </div>

              <div class="lb-stage-viewport">
                <div class="lb-board" id="bb-board"></div>
              </div>

              <nav class="lb-nav" aria-label="ページきりかえ">
                <button class="nav-arrow-btn" id="bb-prev-btn" type="button" aria-label="まえの ページ">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                  </svg>
                </button>

                <div class="lb-dots" id="bb-dots"></div>

                <button class="nav-arrow-btn" id="bb-next-btn" type="button" aria-label="つぎの ページ">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </button>
              </nav>
            </div>
          `;

          this.rootEl = this.container.querySelector('#bb-root');
          this.pcbEl = this.container.querySelector('.lb-pcb-bg');
          this.boardEl = this.container.querySelector('#bb-board');
          this.counterEl = this.container.querySelector('#bb-page-counter');
          this.nameEl = this.container.querySelector('#bb-circuit-name');
          this.tipEl = this.container.querySelector('#bb-circuit-tip');
          this.prevBtn = this.container.querySelector('#bb-prev-btn');
          this.nextBtn = this.container.querySelector('#bb-next-btn');
          this.dotsEl = this.container.querySelector('#bb-dots');

          this.buildDots();

          this.prevBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.goToStage(this.stageIndex - 1, -1);
          });

          this.nextBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.goToStage(this.stageIndex + 1, 1);
          });

          window.addEventListener('keydown', this.onKeyDown);
          this.loadStage(0);
        }

        unmount() {
          window.removeEventListener('keydown', this.onKeyDown);
          this.container.innerHTML = '';
        }

        buildDots() {
          this.dotsEl.innerHTML = '';
          BIG_BABIES_STAGES.forEach((st, idx) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'lb-dot';
            dot.setAttribute('aria-label', `${st.ruby} ページへ`);
            dot.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              if (idx !== this.stageIndex) {
                this.goToStage(idx, idx > this.stageIndex ? 1 : -1);
              }
            });
            this.dotsEl.appendChild(dot);
          });
        }

        goToStage(nextIndex, direction) {
          if (this.isTransitioning) return;
          if (nextIndex < 0 || nextIndex >= BIG_BABIES_STAGES.length) return;

          this.isTransitioning = true;
          this.sound.playPageTurn(direction);
          this.boardEl.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');

          setTimeout(() => {
            this.loadStage(nextIndex);
            this.boardEl.classList.remove('slide-out-left', 'slide-out-right');
            this.isTransitioning = false;
          }, 190);
        }

        loadStage(index) {
          this.stageIndex = index;
          const stage = BIG_BABIES_STAGES[index];
          this.sw = { r: false, y: false };
          this.clkFlash = false;
          this.lastSoundKey = null;

          this.app.setGameBackground(stage.bg);
          this.rootEl.classList.toggle('is-light-bg', !!stage.lightBg);
          this.pcbEl.classList.toggle('is-visible', !!stage.pcb);

          this.counterEl.textContent = `${index + 1} / ${BIG_BABIES_STAGES.length}`;
          this.nameEl.innerHTML = `<ruby>${stage.name}<rt>${stage.ruby}</rt></ruby>`;
          this.tipEl.textContent = stage.tip;

          this.prevBtn.classList.toggle('is-disabled', index === 0);
          this.nextBtn.classList.toggle('is-disabled', index === BIG_BABIES_STAGES.length - 1);

          Array.from(this.dotsEl.children).forEach((dot, i) => {
            dot.classList.toggle('is-active', i === index);
          });

          this.renderBoard(true);
        }

        renderBoard(silent = false) {
          const stage = BIG_BABIES_STAGES[this.stageIndex];
          const res = stage.renderStage(this);

          let switchesHtml = '';
          stage.switches.forEach((swCfg) => {
            const isOn = !!this.sw[swCfg.id];
            const leftPct = (swCfg.x / 900) * 100;
            const topPct = (swCfg.y / 480) * 100;
            const labelLeftPct = ((swCfg.x - 66) / 900) * 100;

            switchesHtml += `
              <div class="btn-side-label" style="left:${labelLeftPct}%; top:${topPct}%; color:${stage.lightBg ? '#3B2E00' : '#FFFFFF'};">
                <ruby>${swCfg.label}<rt style="color:${stage.lightBg ? '#5C4800' : 'rgba(255,255,255,0.88)'};">${swCfg.labelRuby}</rt></ruby>
              </div>
              <div class="toy-rocker sw-${swCfg.color} ${isOn ? 'is-on' : ''}"
                   data-sw-id="${swCfg.id}"
                   data-sw-color="${swCfg.color}"
                   data-is-pulse="${swCfg.isPulseAction ? '1' : '0'}"
                   style="left:${leftPct}%; top:${topPct}%;"
                   role="switch"
                   aria-checked="${isOn ? 'true' : 'false'}">
                <div class="toy-rocker-well">
                  <div class="toy-rocker-paddle">
                    <div class="rocker-mark-on"></div>
                    <div class="rocker-mark-off"></div>
                  </div>
                </div>
                <div class="rocker-state-pill">${swCfg.isPulseAction ? 'おす！' : (isOn ? 'ON' : 'OFF')}</div>
              </div>
            `;
          });

          this.boardEl.innerHTML = `
            <svg class="lb-circuit-svg" viewBox="0 0 900 480" aria-hidden="true">
              ${res.svg}
            </svg>
            ${switchesHtml}
            ${res.extrasHtml || ''}
          `;

          this.bindBoardInteractions();

          if (!silent && res.soundKey !== null && res.soundKey !== this.lastSoundKey) {
            if (res.onSoundChange) res.onSoundChange();
          }
          this.lastSoundKey = res.soundKey;
        }

        bindBoardInteractions() {
          const stage = BIG_BABIES_STAGES[this.stageIndex];

          // Rocker switches
          this.boardEl.querySelectorAll('.toy-rocker').forEach((el) => {
            el.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              const swId = el.dataset.swId;
              const color = el.dataset.swColor;
              const isPulse = el.dataset.isPulse === '1';

              if (isPulse && stage.onPulse) {
                this.sw[swId] = true;
                this.clkFlash = true;
                this.sound.playRockerSwitch(true, color);
                stage.onPulse(this);
                this.renderBoard(false);
                setTimeout(() => {
                  if (BIG_BABIES_STAGES[this.stageIndex] === stage) {
                    this.sw[swId] = false;
                    this.clkFlash = false;
                    this.renderBoard(true);
                  }
                }, 220);
              } else {
                this.sw[swId] = !this.sw[swId];
                this.sound.playRockerSwitch(this.sw[swId], color);
                this.renderBoard(false);
              }
            });
          });

          // Interactive tap nodes (MUX inputs & Memory cells)
          this.boardEl.querySelectorAll('.toy-tap-node').forEach((el) => {
            el.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              const kind = el.dataset.tapKind;
              const idx = Number(el.dataset.tapIdx);
              if (kind === 'mux') {
                this.muxInputs[idx] = !this.muxInputs[idx];
                this.sound.playButtonDown('yellow');
                this.renderBoard(false);
              } else if (kind === 'mem') {
                this.sharedMemory[idx] = !this.sharedMemory[idx];
                this.sound.playMemoryWrite(this.sharedMemory[idx]);
                this.renderBoard(true);
              }
            });
          });

          // Action button (MEMORY WRITE)
          const writeBtn = this.boardEl.querySelector('[data-action="write-mem"]');
          if (writeBtn) {
            writeBtn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              const addr = (this.sw.r ? 2 : 0) + (this.sw.y ? 1 : 0);
              this.sharedMemory[addr] = !this.sharedMemory[addr];
              this.sound.playMemoryWrite(this.sharedMemory[addr]);
              this.renderBoard(true);
              const freshBtn = this.boardEl.querySelector('[data-action="write-mem"]');
              if (freshBtn) {
                freshBtn.classList.add('is-pressed');
                setTimeout(() => freshBtn.classList.remove('is-pressed'), 140);
              }
            });
          }
        }

        handleKeyDown(e) {
          if (e.repeat) return;
          if (e.key === 'ArrowRight') this.goToStage(this.stageIndex + 1, 1);
          if (e.key === 'ArrowLeft')  this.goToStage(this.stageIndex - 1, -1);
        }
      }

      class AppShell {
        constructor() {
          this.sound = new SoundEngine();
          this.activeGame = null;
          this.homeScreen = document.getElementById('home-screen');
          this.gameScreen = document.getElementById('game-screen');
          this.gameGrid = document.getElementById('game-grid');
          this.gameMount = document.getElementById('game-mount');
          this.closeGameBtn = document.getElementById('close-game-btn');

          this.initTouchGuards();
          this.initSoundButtons();

        initTouchGuards() {
          // Unlock audio on very first touch anywhere
          const unlockOnce = () => {
            this.sound.unlock();
          };
          window.addEventListener('pointerdown', unlockOnce, { passive: true });
          window.addEventListener('touchstart', unlockOnce, { passive: true });

          // Block iOS Safari pinch/double-tap zoom & long-press menu
          document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('contextmenu', (e) => e.preventDefault());
          document.addEventListener('dblclick', (e) => e.preventDefault());
        }

        initSoundButtons() {
          const btns = document.querySelectorAll('.js-sound-toggle');
          const syncUI = (muted) => {
            btns.forEach((btn) => {
              btn.classList.toggle('is-muted', muted);
              btn.querySelector('.icon-sound-on').style.display = muted ? 'none' : 'block';
              btn.querySelector('.icon-sound-off').style.display = muted ? 'block' : 'none';
            });
          };

          btns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              const muted = this.sound.toggleMute();
              syncUI(muted);
              if (!muted) {
                this.sound.playButtonUp('yellow');
              }
            });
          });
        }

        initCloseButton() {
          this.closeGameBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.closeGameBtn.classList.add('is-pressed');
            this.sound.playPageTurn(-1);
            setTimeout(() => {
              this.closeGameBtn.classList.remove('is-pressed');
              this.exitGame();
            }, 90);
          });
        }

        renderMenu() {
          this.gameGrid.innerHTML = '';
          GAME_REGISTRY.forEach((item) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = `game-card ${item.available ? '' : 'is-coming-soon'}`;
            card.style.setProperty('--card-bg', item.bg);
            card.style.setProperty('--card-shadow', item.shadow);

            card.innerHTML = `
              <span class="card-badge">${item.badge}</span>
              <div class="card-icon-wrap">${item.iconSvg}</div>
              <div>
                <h2 class="card-title"><ruby>${item.title}<rt>${item.ruby}</rt></ruby></h2>
                <p class="card-desc">${item.desc}</p>
              </div>
              <span class="card-play-pill">
                ${item.available ? '▶ ' : ''}${item.cta}
              </span>
            `;

            card.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              if (item.available) {
                card.classList.add('is-pressed');
                this.sound.playMenuSelect();
                setTimeout(() => {
                  card.classList.remove('is-pressed');
                  this.launchGame(item);
                }, 140);
              } else {
                this.sound.playBoing();
                card.classList.remove('is-boing');
                void card.offsetWidth;
                card.classList.add('is-boing');
              }
            });

            this.gameGrid.appendChild(card);
          });
        }

        setGameBackground(color) {
          this.gameScreen.style.backgroundColor = color;
        }

        launchGame(item) {
          if (this.activeGame) {
            this.activeGame.unmount();
            this.activeGame = null;
          }
          this.activeGame = item.create(this.gameMount, this);
          this.activeGame.mount();

          this.homeScreen.classList.add('is-hidden');
          this.gameScreen.classList.remove('is-hidden');
        }

        exitGame() {
          this.gameScreen.classList.add('is-hidden');
          this.homeScreen.classList.remove('is-hidden');
          setTimeout(() => {
            if (this.activeGame) {
              this.activeGame.unmount();
              this.activeGame = null;
            }
          }, 350);
        }
      }

      // Boot application (works whether DOM is still loading or already interactive)
      function bootApp() {
        try {
          if (!window.__ygenApp) {
            window.__ygenApp = new AppShell();
          }
        } catch (err) {
          const grid = document.getElementById('game-grid');
          if (grid) {
            grid.innerHTML = `<div class="noscript-banner" style="grid-column:1/-1;">起動エラー: ${String(err && err.message ? err.message : err)}</div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootApp);
      } else {
        bootApp();
      }
    })();
  </script>
</body>
</html>
