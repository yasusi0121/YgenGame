      /* Shared big celebration modal (Cracker + Next button) */
      function showCelebrationOverlay(parentEl, { title = 'せいかい！', subtitle = '', centerHtml = '', btnLabel = 'つぎへ', sound, onNext }) {
        const existing = parentEl.querySelector('.celeb-overlay');
        if (existing) existing.remove();

        if (sound) sound.playCrackerPop();

        const overlay = document.createElement('div');
        overlay.className = 'celeb-overlay';
        overlay.innerHTML = `
          <div class="celeb-card">
            <div class="celeb-icons-row">
              <span class="celeb-cracker-l">${FLAT_ICONS.cracker(58)}</span>
              ${centerHtml || FLAT_ICONS.star(62)}
              <span class="celeb-cracker-r">${FLAT_ICONS.cracker(58)}</span>
            </div>
            <h3 class="celeb-title">${title}</h3>
            ${subtitle ? `<p class="celeb-sub">${subtitle}</p>` : ''}
            <button class="celeb-next-btn" type="button">
              <span>${btnLabel}</span>
              ${FLAT_ICONS.arrowRight(28)}
            </button>
          </div>
        `;

        const btn = overlay.querySelector('.celeb-next-btn');
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (sound) sound.playPageTurn(1);
          overlay.remove();
          if (onNext) onNext();
        });

        parentEl.appendChild(overlay);
      }

      /* =========================================================================
         2C. GAME 3: COLOR MIX (いろの まほう — Big Visual Target + Cracker Modal)
         ========================================================================= */
      const COLOR_PAINTS = {
        red:    { id: 'red',    name: 'あか',   hex: '#FF4757', shadow: '#C81E2B', fg: '#FFFFFF', pitch: 0 },
        yellow: { id: 'yellow', name: 'きいろ', hex: '#FFD32A', shadow: '#D69600', fg: '#4D3300', pitch: 2 },
        blue:   { id: 'blue',   name: 'あお',   hex: '#1E90FF', shadow: '#0C5BB8', fg: '#FFFFFF', pitch: 4 },
        white:  { id: 'white',  name: 'しろ',   hex: '#FFFFFF', shadow: '#CBD5E1', fg: '#334155', pitch: 6 }
      };

      const COLOR_RECIPES = {
        '':                      { name: 'まぜてね',   hex: '#F1F5F9', icon: 'sparkle' },
        'red':                   { name: 'あか',       hex: '#FF4757', icon: 'apple' },
        'yellow':                { name: 'きいろ',     hex: '#FFD32A', icon: 'lemon' },
        'blue':                  { name: 'あお',       hex: '#1E90FF', icon: 'whale' },
        'white':                 { name: 'しろ',       hex: '#FFFFFF', icon: 'cloud' },
        'red+yellow':            { name: 'おれんじ',   hex: '#FF8C1A', icon: 'orange',    mission: true },
        'blue+yellow':           { name: 'みどり',     hex: '#2ED573', icon: 'clover',    mission: true },
        'blue+red':              { name: 'むらさき',   hex: '#9B59B6', icon: 'grape',     mission: true },
        'red+white':             { name: 'ぴんく',     hex: '#FF85B3', icon: 'peach',     mission: true },
        'blue+white':            { name: 'みずいろ',   hex: '#67E8F9', icon: 'dolphin',   mission: true },
        'white+yellow':          { name: 'くりーむ',   hex: '#FEF08A', icon: 'icecream',  mission: true },
        'blue+red+yellow':       { name: 'ちゃいろ',   hex: '#8D5524', icon: 'choco',     mission: true },
        'red+white+yellow':      { name: 'ぴーち',     hex: '#FFB07C', icon: 'flower',    mission: true },
        'blue+white+yellow':     { name: 'みんと',     hex: '#6EE7B7', icon: 'leaf',      mission: true },
        'blue+red+white':        { name: 'らべんだー', hex: '#C4B5FD', icon: 'lavender',  mission: true },
        'blue+red+white+yellow': { name: 'みるくてぃ', hex: '#C69C72', icon: 'bear',      mission: true }
      };

      class ColorMixGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.drops = new Set();
          this.missionKeys = Object.keys(COLOR_RECIPES).filter((k) => COLOR_RECIPES[k].mission);
          this.missionIndex = 0;
          this.locked = false;
        }

        mount() {
          this.app.setGameBackground('#7C6AEF');
          this.container.innerHTML = `
            <div class="cm-root" id="cm-root">
              <div class="lb-title-area" style="margin-top:4px;">
                <h2 class="lb-circuit-name"><ruby>COLOR MIX<rt>いろの まほう</rt></ruby></h2>
              </div>

              <div class="cm-stage">
                <div class="cm-compare-row">
                  <!-- LEFT: Huge visual target color -->
                  <div class="cm-target-box">
                    <div class="cm-big-circle is-target">
                      <div class="cm-liquid" id="cm-target-liquid">
                        <div class="cm-result-icon" id="cm-target-icon"></div>
                        <div class="cm-result-name" id="cm-target-name"></div>
                      </div>
                    </div>
                    <button class="cm-skip-btn" type="button" id="cm-skip-btn">べつの いろ</button>
                  </div>

                  <div class="cm-arrow-mid" aria-hidden="true">
                    ${FLAT_ICONS.arrowRight(34)}
                  </div>

                  <!-- RIGHT: Mixing bowl -->
                  <div class="cm-target-box">
                    <div class="cm-big-circle" id="cm-bowl">
                      <div class="cm-liquid" id="cm-liquid">
                        <div class="cm-result-icon" id="cm-icon"></div>
                        <div class="cm-result-name" id="cm-name">まぜてね</div>
                      </div>
                    </div>
                    <div class="cm-formula" id="cm-formula"></div>
                  </div>
                </div>
              </div>

              <div class="cm-palette" id="cm-palette">
                ${Object.values(COLOR_PAINTS).map((p) => `
                  <button class="cm-paint-btn" type="button" data-paint="${p.id}"
                          style="--p-bg:${p.hex}; --p-shadow:${p.shadow}; --p-fg:${p.fg};">
                    ${FLAT_ICONS.drop(34, p.id === 'white' ? '#F8FAFC' : 'rgba(255,255,255,0.38)', p.id === 'white' ? '#CBD5E1' : '#FFFFFF')}
                    <span>${p.name}</span>
                  </button>
                `).join('')}
                <button class="cm-paint-btn" type="button" data-paint="clear"
                        style="--p-bg:#475569; --p-shadow:#1E293B; --p-fg:#FFFFFF;">
                  ${FLAT_ICONS.wash(34)}
                  <span>あらう</span>
                </button>
              </div>
            </div>
          `;

          this.rootEl = this.container.querySelector('#cm-root');
          this.targetLiquidEl = this.container.querySelector('#cm-target-liquid');
          this.targetIconEl = this.container.querySelector('#cm-target-icon');
          this.targetNameEl = this.container.querySelector('#cm-target-name');
          this.bowlEl = this.container.querySelector('#cm-bowl');
          this.liquidEl = this.container.querySelector('#cm-liquid');
          this.iconEl = this.container.querySelector('#cm-icon');
          this.nameEl = this.container.querySelector('#cm-name');
          this.formulaEl = this.container.querySelector('#cm-formula');
          this.paintBtns = Array.from(this.container.querySelectorAll('.cm-paint-btn'));

          this.container.querySelector('#cm-skip-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (this.locked) return;
            this.sound.unlock();
            this.sound.playPageTurn(1);
            this.nextMission();
          });

          this.paintBtns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              if (this.locked) return;
              this.sound.unlock();
              const id = btn.dataset.paint;
              if (id === 'clear') {
                this.drops.clear();
                this.sound.playPageTurn(-1);
                this.updateUI(true);
                return;
              }
              if (this.drops.has(id)) {
                this.drops.delete(id);
              } else {
                this.drops.add(id);
              }
              this.sound.playSplash(COLOR_PAINTS[id].pitch);
              this.updateUI(true);
            });
          });

          this.updateUI(false);
        }

        unmount() {
          this.container.innerHTML = '';
        }

        nextMission() {
          this.missionIndex = (this.missionIndex + 1) % this.missionKeys.length;
          this.drops.clear();
          this.locked = false;
          this.updateUI(false);
        }

        getRecipeKey() {
          return Array.from(this.drops).sort().join('+');
        }

        updateUI(animate) {
          const key = this.getRecipeKey();
          const result = COLOR_RECIPES[key] || COLOR_RECIPES[''];
          const targetKey = this.missionKeys[this.missionIndex];
          const target = COLOR_RECIPES[targetKey];

          // Target circle (huge & unmistakable)
          this.targetLiquidEl.style.backgroundColor = target.hex;
          this.targetIconEl.innerHTML = FLAT_ICONS[target.icon](68);
          this.targetNameEl.textContent = target.name;

          // Mixing bowl circle
          this.liquidEl.style.backgroundColor = result.hex;
          this.iconEl.innerHTML = FLAT_ICONS[result.icon](68);
          this.nameEl.textContent = result.name;

          this.paintBtns.forEach((btn) => {
            btn.classList.toggle('is-picked', this.drops.has(btn.dataset.paint));
          });

          if (animate) {
            this.bowlEl.classList.remove('is-splash');
            void this.bowlEl.offsetWidth;
            this.bowlEl.classList.add('is-splash');
          }

          if (this.drops.size === 0) {
            this.formulaEl.innerHTML = '';
          } else {
            const orbs = Array.from(this.drops).map((id) =>
              `<span class="cm-drop-orb" style="background:${COLOR_PAINTS[id].hex};"></span>`
            );
            this.formulaEl.innerHTML = orbs.join(`<span style="color:#FFFFFF;display:inline-flex;">${FLAT_ICONS.plusSign(20)}</span>`);
          }

          // Match! Launch big celebratory cracker modal
          if (key === targetKey && !this.locked) {
            this.locked = true;
            setTimeout(() => {
              showCelebrationOverlay(this.rootEl, {
                title: 'せいかい！',
                subtitle: `${target.name} が できたよ！`,
                centerHtml: `<div style="width:76px;height:76px;border-radius:50%;background:${target.hex};display:grid;place-items:center;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,0.14);">${FLAT_ICONS[target.icon](52)}</div>`,
                btnLabel: 'つぎの いろへ',
                sound: this.sound,
                onNext: () => this.nextMission()
              });
            }, 260);
          }
        }
      }

      /* =========================================================================
         2D. GAME 4: SOUND MAGIC (おとの まほう — Real Piano G3..E5)
             White keys: G3, A3, B3, C4(ド), D4, E4, F4, G4, A4, B4, C5(ド), D5, E5
             Black keys: G#3, A#3, C#4, D#4, F#4, G#4, A#4, C#5, D#5
         ========================================================================= */
      const PIANO_WHITE_KEYS = [
        { id: 'G3', label: 'そ',   freq: 196.00, accent: '#2EC4B6' },
        { id: 'A3', label: 'ら',   freq: 220.00, accent: '#3A86FF' },
        { id: 'B3', label: 'し',   freq: 246.94, accent: '#8338EC' },
        { id: 'C4', label: 'ド',   freq: 261.63, accent: '#FF595E', isC: true },
        { id: 'D4', label: 'れ',   freq: 293.66, accent: '#FF924C' },
        { id: 'E4', label: 'み',   freq: 329.63, accent: '#FFCA3A' },
        { id: 'F4', label: 'ふぁ', freq: 349.23, accent: '#8AC926' },
        { id: 'G4', label: 'そ',   freq: 392.00, accent: '#2EC4B6' },
        { id: 'A4', label: 'ら',   freq: 440.00, accent: '#3A86FF' },
        { id: 'B4', label: 'し',   freq: 493.88, accent: '#8338EC' },
        { id: 'C5', label: 'ド',   freq: 523.25, accent: '#FF595E', isC: true },
        { id: 'D5', label: 'れ',   freq: 587.33, accent: '#FF924C' },
        { id: 'E5', label: 'み',   freq: 659.25, accent: '#FFCA3A' }
      ];

      // Black keys positioned between white key index `afterWhite` and `afterWhite + 1`
      const PIANO_BLACK_KEYS = [
        { id: 'Gs3', afterWhite: 0,  freq: 207.65 },
        { id: 'As3', afterWhite: 1,  freq: 233.08 },
        { id: 'Cs4', afterWhite: 3,  freq: 277.18 },
        { id: 'Ds4', afterWhite: 4,  freq: 311.13 },
        { id: 'Fs4', afterWhite: 6,  freq: 369.99 },
        { id: 'Gs4', afterWhite: 7,  freq: 415.30 },
        { id: 'As4', afterWhite: 8,  freq: 466.16 },
        { id: 'Cs5', afterWhite: 10, freq: 554.37 },
        { id: 'Ds5', afterWhite: 11, freq: 622.25 }
      ];

      // Follow-along melodies using white key IDs around middle C (C4)
      const SOUND_SONGS = [
        { name: 'きらきらぼし', notes: ['C4', 'C4', 'G4', 'G4', 'A4', 'A4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4'] },
        { name: 'かえるのうた', notes: ['C4', 'D4', 'E4', 'F4', 'E4', 'D4', 'C4', 'E4', 'F4', 'G4', 'A4', 'G4', 'F4', 'E4'] },
        { name: 'ちょうちょう', notes: ['G4', 'E4', 'E4', 'F4', 'D4', 'D4', 'C4', 'D4', 'E4', 'F4', 'G4', 'G4', 'G4'] }
      ];

      class SoundMagicGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.instrument = 'piano';
          this.songIndex = -1;
          this.songStep = 0;
        }

        mount() {
          this.app.setGameBackground('#3A86FF');
          const whiteCount = PIANO_WHITE_KEYS.length;
          const blackWidthPct = (100 / whiteCount) * 0.64;

          this.container.innerHTML = `
            <div class="sm-root">
              <div class="lb-title-area" style="margin-top:4px;">
                <h2 class="lb-circuit-name"><ruby>SOUND MAGIC<rt>おとの まほう</rt></ruby></h2>
                <p class="lb-circuit-tip" id="sm-tip">ぴあのを ひいてみよう！</p>
              </div>

              <div class="sm-controls" id="sm-inst-bar">
                <button class="sm-inst-btn is-active" type="button" data-inst="piano">${FLAT_ICONS.piano(22)}<span>ぴあの</span></button>
                <button class="sm-inst-btn" type="button" data-inst="marimba">${FLAT_ICONS.marimba(22)}<span>もっきん</span></button>
                <button class="sm-inst-btn" type="button" data-inst="sparkle">${FLAT_ICONS.sparkle(22)}<span>きらきら</span></button>
                <button class="sm-inst-btn" type="button" data-inst="drum">${FLAT_ICONS.drum(22)}<span>たいこ</span></button>
                <button class="sm-inst-btn" type="button" id="sm-song-btn" style="background:#FFD12E;color:#4D3300;border-color:#FFFFFF;">
                  ${FLAT_ICONS.note(20, '#4D3300')}<span id="sm-song-label">まねっこ</span>
                </button>
              </div>

              <div class="sm-piano-frame">
                <div class="sm-piano-scroll">
                  <div class="sm-piano" id="sm-piano">
                    ${PIANO_WHITE_KEYS.map((k, idx) => `
                      <button class="piano-white-key ${k.isC ? 'is-c-key' : ''}" type="button"
                              data-note-id="${k.id}" data-freq="${k.freq}" data-idx="${idx}"
                              style="--key-accent:${k.accent};">
                        ${k.isC ? FLAT_ICONS.star(18) : ''}
                        <span class="piano-key-name">${k.label}</span>
                      </button>
                    `).join('')}
                    ${PIANO_BLACK_KEYS.map((bk, bIdx) => {
                      const leftPct = ((bk.afterWhite + 1) / whiteCount) * 100;
                      return `
                        <button class="piano-black-key" type="button"
                                data-note-id="${bk.id}" data-freq="${bk.freq}" data-idx="${bIdx + 3}"
                                style="left:${leftPct}%; width:${blackWidthPct}%;"
                                aria-label="黒鍵"></button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;

          this.tipEl = this.container.querySelector('#sm-tip');
          this.songBtn = this.container.querySelector('#sm-song-btn');
          this.songLabelEl = this.container.querySelector('#sm-song-label');
          this.keyEls = Array.from(this.container.querySelectorAll('[data-note-id]'));

          // Instrument switcher
          this.container.querySelectorAll('[data-inst]').forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              this.instrument = btn.dataset.inst;
              this.container.querySelectorAll('[data-inst]').forEach((b) => b.classList.toggle('is-active', b === btn));
              this.sound.playInstrumentNote(this.instrument, 261.63, 0);
            });
          });

          // Follow-along song mode toggle
          this.songBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.songIndex = this.songIndex + 1;
            if (this.songIndex >= SOUND_SONGS.length) {
              this.songIndex = -1;
            }
            this.songStep = 0;
            this.sound.playPageTurn(1);
            this.updateSongGuide();
          });

          // Multi-touch playable piano keys (white + black)
          this.keyEls.forEach((keyEl) => {
            const noteId = keyEl.dataset.noteId;
            const freq = Number(keyEl.dataset.freq);
            const idx = Number(keyEl.dataset.idx);
            const activePointers = new Set();

            keyEl.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              e.stopPropagation();
              this.sound.unlock();
              try { keyEl.setPointerCapture(e.pointerId); } catch (_) {}
              activePointers.add(e.pointerId);
              keyEl.classList.add('is-pressed');

              this.sound.playInstrumentNote(this.instrument, freq, idx);
              this.spawnFloatingNote(keyEl);

              if (this.songIndex >= 0) {
                const song = SOUND_SONGS[this.songIndex];
                if (song.notes[this.songStep] === noteId) {
                  this.songStep++;
                  if (this.songStep >= song.notes.length) {
                    this.songStep = 0;
                    setTimeout(() => this.sound.playSuccessFanfare(), 240);
                    this.tipEl.textContent = `すごい！「${song.name}」ひけたよ！`;
                  }
                  this.updateSongGuide(true);
                }
              }
            });

            const release = (e) => {
              activePointers.delete(e.pointerId);
              if (activePointers.size === 0) {
                keyEl.classList.remove('is-pressed');
              }
            };
            keyEl.addEventListener('pointerup', release);
            keyEl.addEventListener('pointercancel', release);
            keyEl.addEventListener('lostpointercapture', release);
          });

          this.updateSongGuide();
        }

        unmount() {
          this.container.innerHTML = '';
        }

        spawnFloatingNote(keyEl) {
          const note = document.createElement('span');
          note.className = 'sm-float-note';
          const colors = ['#FF595E', '#FFD12E', '#4ADE80', '#38BDF8', '#A78BFA'];
          const col = colors[Math.floor(Math.random() * colors.length)];
          note.innerHTML = Math.random() > 0.35 ? FLAT_ICONS.note(30, col) : FLAT_ICONS.star(28);
          keyEl.appendChild(note);
          setTimeout(() => note.remove(), 740);
        }

        updateSongGuide(keepSuccessTip = false) {
          this.keyEls.forEach((el) => el.classList.remove('is-guide'));
          if (this.songIndex < 0) {
            this.songLabelEl.textContent = 'まねっこ';
            if (!keepSuccessTip) this.tipEl.textContent = 'ぴあのを ひいてみよう！';
            return;
          }
          const song = SOUND_SONGS[this.songIndex];
          this.songLabelEl.textContent = song.name;
          if (!keepSuccessTip) {
            this.tipEl.textContent = `ひかる けんばん を おそう！（${song.name}）`;
          }
          const targetId = song.notes[this.songStep];
          const targetEl = this.container.querySelector(`[data-note-id="${targetId}"]`);
          if (targetEl) {
            targetEl.classList.add('is-guide');
          }
        }
      }

      /* =========================================================================
         2E. GAME 5: PLUS MAGIC (たしざん の まほう — 3 Modes, Flat SVG Icons)
         ========================================================================= */
      const PLUS_THEME_ICONS = ['apple', 'strawberry', 'orange', 'star', 'chick'];

      class PlusMagicGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.mode = 'concept';

          this.cA = 2;
          this.cB = 3;
          this.cMerged = false;
          this.cCountTimer = null;

          this.stepLevel = 1;
          this.stepStreak = 0;

          this.randMax = 10;
          this.randHint = true;
          this.randScore = 0;

          this.qA = 1;
          this.qB = 1;
          this.qChoices = [];
          this.qSolved = false;
          this.qIconKey = 'apple';
        }

        mount() {
          this.app.setGameBackground('#22A06B');
          this.container.innerHTML = `
            <div class="pm-root">
              <div class="lb-title-area" style="margin-top:2px;">
                <h2 class="lb-circuit-name"><ruby>PLUS MAGIC<rt>たしざん の まほう</rt></ruby></h2>
                <p class="lb-circuit-tip" id="pm-tip">あわせると いくつ？</p>
              </div>

              <div class="pm-mode-tabs" id="pm-tabs">
                <button class="pm-tab-btn is-active" type="button" data-mode="concept">1. わかる</button>
                <button class="pm-tab-btn" type="button" data-mode="step">2. ステップ</button>
                <button class="pm-tab-btn" type="button" data-mode="random">3. ランダム</button>
              </div>

              <div class="pm-board" id="pm-board"></div>
            </div>
          `;

          this.tipEl = this.container.querySelector('#pm-tip');
          this.boardEl = this.container.querySelector('#pm-board');
          this.tabBtns = Array.from(this.container.querySelectorAll('.pm-tab-btn'));

          this.tabBtns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              this.switchMode(btn.dataset.mode);
            });
          });

          this.switchMode('concept');
        }

        unmount() {
          clearTimeout(this.cCountTimer);
          this.container.innerHTML = '';
        }

        switchMode(mode) {
          clearTimeout(this.cCountTimer);
          this.mode = mode;
          this.tabBtns.forEach((b) => b.classList.toggle('is-active', b.dataset.mode === mode));
          this.sound.playPageTurn(1);

          if (mode === 'concept') {
            this.app.setGameBackground('#22A06B');
            this.cMerged = false;
            this.tipEl.textContent = '「あわせる！」を おしてみよう！';
            this.renderConcept();
          } else if (mode === 'step') {
            this.app.setGameBackground('#0EA5E9');
            this.tipEl.textContent = 'あわせて いくつに なるかな？';
            this.generateQuestion();
            this.renderQuiz();
          } else {
            this.app.setGameBackground('#F59E0B');
            this.tipEl.textContent = 'いろんな たしざん に ちょうせん！';
            this.generateQuestion();
            this.renderQuiz();
          }
        }

        renderConcept() {
          const sum = this.cA + this.cB;
          const itemsA = Array.from({ length: this.cA }, () => `<span class="pm-item">${FLAT_ICONS.apple(38)}</span>`).join('');
          const itemsB = Array.from({ length: this.cB }, () => `<span class="pm-item">${FLAT_ICONS.greenApple(38)}</span>`).join('');
          const mergedItems = Array.from({ length: sum }, (_, i) =>
            `<span class="pm-item" data-count-idx="${i}">${i < this.cA ? FLAT_ICONS.apple(38) : FLAT_ICONS.greenApple(38)}</span>`
          ).join('');

          this.boardEl.innerHTML = `
            <div class="pm-equation-card">
              <div class="pm-visual-groups">
                ${this.cMerged ? `
                  <div class="pm-basket is-merged" id="pm-merged-basket">${mergedItems}</div>
                ` : `
                  <div class="pm-basket">${itemsA}</div>
                  <span style="color:#64748B;display:inline-flex;">${FLAT_ICONS.plusSign(30)}</span>
                  <div class="pm-basket is-right">${itemsB}</div>
                `}
              </div>

              <div class="pm-eq-text">
                <span class="pm-num-a">${this.cA}</span>
                <span>＋</span>
                <span class="pm-num-b">${this.cB}</span>
                <span>＝</span>
                <span class="pm-num-ans ${this.cMerged ? 'is-correct' : ''}" id="pm-concept-ans">${this.cMerged ? sum : '？'}</span>
              </div>
            </div>

            <div class="pm-concept-controls">
              <div class="pm-stepper">
                ${FLAT_ICONS.apple(30)}
                <button class="pm-step-btn" type="button" data-act="a-dec" aria-label="へらす" style="--s-bg:#FF7043;--s-sh:#D84315;">${FLAT_ICONS.minusSign(24)}</button>
                <span style="font-size:24px;font-weight:900;min-width:26px;text-align:center;">${this.cA}</span>
                <button class="pm-step-btn" type="button" data-act="a-inc" aria-label="ふやす" style="--s-bg:#FF7043;--s-sh:#D84315;">${FLAT_ICONS.plusSign(24)}</button>
              </div>

              <button class="pm-merge-btn" type="button" data-act="toggle-merge">
                ${this.cMerged ? 'わける' : `${FLAT_ICONS.sparkle(24)}<span>あわせる！</span>`}
              </button>

              <div class="pm-stepper">
                ${FLAT_ICONS.greenApple(30)}
                <button class="pm-step-btn" type="button" data-act="b-dec" aria-label="へらす" style="--s-bg:#0EA5E9;--s-sh:#0369A1;">${FLAT_ICONS.minusSign(24)}</button>
                <span style="font-size:24px;font-weight:900;min-width:26px;text-align:center;">${this.cB}</span>
                <button class="pm-step-btn" type="button" data-act="b-inc" aria-label="ふやす" style="--s-bg:#0EA5E9;--s-sh:#0369A1;">${FLAT_ICONS.plusSign(24)}</button>
              </div>
            </div>
          `;

          this.boardEl.querySelectorAll('[data-act]').forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              clearTimeout(this.cCountTimer);
              const act = btn.dataset.act;
              if (act === 'a-dec' && this.cA > 1) { this.cA--; this.cMerged = false; this.sound.playButtonDown('red'); }
              if (act === 'a-inc' && this.cA < 5) { this.cA++; this.cMerged = false; this.sound.playButtonDown('red'); }
              if (act === 'b-dec' && this.cB > 1) { this.cB--; this.cMerged = false; this.sound.playButtonDown('yellow'); }
              if (act === 'b-inc' && this.cB < 5) { this.cB++; this.cMerged = false; this.sound.playButtonDown('yellow'); }
              if (act === 'toggle-merge') {
                this.cMerged = !this.cMerged;
                this.renderConcept();
                if (this.cMerged) {
                  this.animateCountUp(this.cA + this.cB);
                } else {
                  this.sound.playPageTurn(-1);
                }
                return;
              }
              this.renderConcept();
            });
          });
        }

        animateCountUp(total) {
          let i = 0;
          const step = () => {
            const el = this.boardEl.querySelector(`[data-count-idx="${i}"]`);
            if (el) {
              el.classList.add('is-pop');
              setTimeout(() => el.classList.remove('is-pop'), 220);
            }
            this.sound.playCountPip(i);
            i++;
            if (i < total) {
              this.cCountTimer = setTimeout(step, 180);
            } else {
              this.cCountTimer = setTimeout(() => this.sound.playSuccessFanfare(), 200);
            }
          };
          step();
        }

        generateQuestion() {
          this.qSolved = false;
          this.qIconKey = PLUS_THEME_ICONS[Math.floor(Math.random() * PLUS_THEME_ICONS.length)];

          let a = 1, b = 1;
          if (this.mode === 'step') {
            if (this.stepLevel === 1) {
              const sum = 2 + Math.floor(Math.random() * 4);
              a = 1 + Math.floor(Math.random() * (sum - 1));
              b = sum - a;
            } else if (this.stepLevel === 2) {
              const sum = 5 + Math.floor(Math.random() * 6);
              a = 1 + Math.floor(Math.random() * (sum - 1));
              b = sum - a;
            } else {
              a = 5 + Math.floor(Math.random() * 5);
              b = Math.max(2, 10 - a) + Math.floor(Math.random() * Math.min(6, 16 - a));
              if (a + b > 15) b = 15 - a;
            }
          } else {
            const maxSum = this.randMax;
            const sum = 2 + Math.floor(Math.random() * (maxSum - 1));
            a = 1 + Math.floor(Math.random() * (sum - 1));
            b = sum - a;
          }

          this.qA = a;
          this.qB = b;

          const ans = a + b;
          const set = new Set([ans]);
          const deltas = [-2, -1, 1, 2, 3, -3];
          while (set.size < 4) {
            const d = deltas[Math.floor(Math.random() * deltas.length)];
            const cand = ans + d;
            if (cand >= 1 && cand <= 20) set.add(cand);
          }
          this.qChoices = Array.from(set).sort(() => Math.random() - 0.5);
        }

        renderQuiz() {
          const ans = this.qA + this.qB;
          const showVisuals = this.mode === 'step' || this.randHint;
          const iconHtml = FLAT_ICONS[this.qIconKey](36);
          const itemsA = Array.from({ length: this.qA }, () => `<span class="pm-item">${iconHtml}</span>`).join('');
          const itemsB = Array.from({ length: this.qB }, () => `<span class="pm-item">${iconHtml}</span>`).join('');

          const starsHtml = Array.from({ length: 3 }, (_, i) =>
            i < this.stepStreak ? FLAT_ICONS.star(22) : FLAT_ICONS.starEmpty(22)
          ).join('');

          const statusHtml = this.mode === 'step' ? `
            <div class="pm-status-row">
              <span class="pm-pill">レベル ${this.stepLevel} / 3</span>
              <span class="pm-pill">${starsHtml}</span>
            </div>
          ` : `
            <div class="pm-status-row">
              <span class="pm-pill">${FLAT_ICONS.star(22)}<span>${this.randScore}</span></span>
              <button class="pm-toggle-pill ${this.randMax === 20 ? 'is-on' : ''}" type="button" data-qact="toggle-max">
                ${this.randMax === 10 ? '10 まで' : '20 まで'}
              </button>
              <button class="pm-toggle-pill ${this.randHint ? 'is-on' : ''}" type="button" data-qact="toggle-hint">
                え：${this.randHint ? 'ON' : 'OFF'}
              </button>
            </div>
          `;

          this.boardEl.innerHTML = `
            ${statusHtml}
            <div class="pm-equation-card">
              ${showVisuals ? `
                <div class="pm-visual-groups">
                  <div class="pm-basket">${itemsA}</div>
                  <span style="color:#64748B;display:inline-flex;">${FLAT_ICONS.plusSign(28)}</span>
                  <div class="pm-basket is-right">${itemsB}</div>
                </div>
              ` : ''}
              <div class="pm-eq-text">
                <span class="pm-num-a">${this.qA}</span>
                <span>＋</span>
                <span class="pm-num-b">${this.qB}</span>
                <span>＝</span>
                <span class="pm-num-ans ${this.qSolved ? 'is-correct' : ''}">${this.qSolved ? ans : '？'}</span>
              </div>
            </div>

            <div class="pm-choices">
              ${this.qChoices.map((n) => `
                <button class="pm-choice-btn ${this.qSolved && n === ans ? 'is-correct' : ''}" type="button" data-choice="${n}">${n}</button>
              `).join('')}
            </div>
          `;

          this.boardEl.querySelectorAll('[data-qact]').forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              if (btn.dataset.qact === 'toggle-max') {
                this.randMax = this.randMax === 10 ? 20 : 10;
                this.generateQuestion();
              } else {
                this.randHint = !this.randHint;
              }
              this.sound.playButtonDown('yellow');
              this.renderQuiz();
            });
          });

          this.boardEl.querySelectorAll('[data-choice]').forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              if (this.qSolved) return;
              this.sound.unlock();
              const picked = Number(btn.dataset.choice);
              if (picked === ans) {
                this.qSolved = true;
                this.sound.playSuccessFanfare();
                if (this.mode === 'step') {
                  this.stepStreak++;
                  if (this.stepStreak >= 3 && this.stepLevel < 3) {
                    this.stepLevel++;
                    this.stepStreak = 0;
                    this.tipEl.textContent = `レベル ${this.stepLevel} に ステップアップ！`;
                  } else {
                    this.tipEl.textContent = `せいかい！ ${this.qA} ＋ ${this.qB} ＝ ${ans}`;
                  }
                } else {
                  this.randScore++;
                  this.tipEl.textContent = `せいかい！ ${this.qA} ＋ ${this.qB} ＝ ${ans}`;
                }
                this.renderQuiz();
                this.cCountTimer = setTimeout(() => {
                  this.generateQuestion();
                  this.renderQuiz();
                }, 1150);
              } else {
                this.sound.playGentleNudge();
                btn.classList.remove('is-wrong');
                void btn.offsetWidth;
                btn.classList.add('is-wrong');
                this.tipEl.textContent = 'もういっかい かぞえてみよう！';
              }
            });
          });
        }
      }

      /* =========================================================================
         2F. GAME 6: PITCH QUIZ (ぜったい おんかん — Listen -> Answer on Piano)
         ========================================================================= */
      const PQ_LEVELS = {
        easy:   { label: 'かんたん', notes: ['C4', 'E4', 'G4'] },
        normal: { label: 'ふつう',   notes: ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'] },
        hard:   { label: 'むずかしい', notes: ['C4', 'Cs4', 'D4', 'Ds4', 'E4', 'F4', 'Fs4', 'G4', 'Gs4', 'A4', 'As4', 'B4', 'C5'] }
      };

      const PQ_WHITE_KEYS = [
        { id: 'C4', label: 'ド',   freq: 261.63, accent: '#FF595E', isC: true },
        { id: 'D4', label: 'れ',   freq: 293.66, accent: '#FF924C' },
        { id: 'E4', label: 'み',   freq: 329.63, accent: '#FFCA3A' },
        { id: 'F4', label: 'ふぁ', freq: 349.23, accent: '#8AC926' },
        { id: 'G4', label: 'そ',   freq: 392.00, accent: '#2EC4B6' },
        { id: 'A4', label: 'ら',   freq: 440.00, accent: '#3A86FF' },
        { id: 'B4', label: 'し',   freq: 493.88, accent: '#8338EC' },
        { id: 'C5', label: 'ド',   freq: 523.25, accent: '#FF595E', isC: true }
      ];

      const PQ_BLACK_KEYS = [
        { id: 'Cs4', label: 'ド♯', afterWhite: 0, freq: 277.18 },
        { id: 'Ds4', label: 'れ♯', afterWhite: 1, freq: 311.13 },
        { id: 'Fs4', label: 'ふぁ♯', afterWhite: 3, freq: 369.99 },
        { id: 'Gs4', label: 'そ♯', afterWhite: 4, freq: 415.30 },
        { id: 'As4', label: 'ら♯', afterWhite: 5, freq: 466.16 }
      ];

      const PQ_ALL_MAP = {};
      PQ_WHITE_KEYS.forEach((k) => { PQ_ALL_MAP[k.id] = k; });
      PQ_BLACK_KEYS.forEach((k) => { PQ_ALL_MAP[k.id] = k; });

      class PitchQuizGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.level = 'easy';
          this.phase = 'listen'; // 'listen' | 'answer' | 'solved'
          this.targetId = 'C4';
          this.score = 0;
          this.timer = null;
        }

        mount() {
          this.app.setGameBackground('#E85D75');
          const whiteCount = PQ_WHITE_KEYS.length;
          const blackWidthPct = (100 / whiteCount) * 0.62;

          this.container.innerHTML = `
            <div class="pq-root" id="pq-root">
              <div class="lb-title-area" style="margin-top:2px;">
                <h2 class="lb-circuit-name"><ruby>PITCH QUIZ<rt>ぜったい おんかん</rt></ruby></h2>
              </div>

              <div class="pm-status-row">
                <div class="pm-mode-tabs" id="pq-levels">
                  <button class="pm-tab-btn is-active" type="button" data-lv="easy">かんたん</button>
                  <button class="pm-tab-btn" type="button" data-lv="normal">ふつう</button>
                  <button class="pm-tab-btn" type="button" data-lv="hard">むずかしい</button>
                </div>
                <span class="pm-pill" id="pq-score">${FLAT_ICONS.star(22)}<span>0</span></span>
              </div>

              <div class="pq-stage">
                <button class="pq-listen-btn" type="button" id="pq-listen-btn" aria-label="おとを きく">
                  ${FLAT_ICONS.speaker(48, '#4D3300')}
                  <span id="pq-listen-label">きく</span>
                </button>
                <div class="pq-phase-pill" id="pq-phase-pill">おとを きいてね！</div>
              </div>

              <div class="sm-piano-frame" id="pq-piano-frame">
                <div class="sm-piano-scroll" style="max-width:780px;">
                  <div class="sm-piano" id="pq-piano" style="min-width:520px;">
                    ${PQ_WHITE_KEYS.map((k, idx) => `
                      <button class="piano-white-key ${k.isC ? 'is-c-key' : ''}" type="button"
                              data-note-id="${k.id}" data-freq="${k.freq}" data-idx="${idx}"
                              style="--key-accent:${k.accent};">
                        ${k.isC ? FLAT_ICONS.star(18) : ''}
                        <span class="piano-key-name">${k.label}</span>
                      </button>
                    `).join('')}
                    ${PQ_BLACK_KEYS.map((bk, bIdx) => {
                      const leftPct = ((bk.afterWhite + 1) / whiteCount) * 100;
                      return `
                        <button class="piano-black-key" type="button"
                                data-note-id="${bk.id}" data-freq="${bk.freq}" data-idx="${bIdx + 10}"
                                style="left:${leftPct}%; width:${blackWidthPct}%;"
                                aria-label="黒鍵"></button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;

          this.rootEl = this.container.querySelector('#pq-root');
          this.scoreEl = this.container.querySelector('#pq-score');
          this.listenBtn = this.container.querySelector('#pq-listen-btn');
          this.listenLabel = this.container.querySelector('#pq-listen-label');
          this.phasePill = this.container.querySelector('#pq-phase-pill');
          this.pianoFrame = this.container.querySelector('#pq-piano-frame');
          this.levelBtns = Array.from(this.container.querySelectorAll('[data-lv]'));
          this.keyEls = Array.from(this.container.querySelectorAll('[data-note-id]'));

          this.levelBtns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              this.level = btn.dataset.lv;
              this.levelBtns.forEach((b) => b.classList.toggle('is-active', b === btn));
              this.startRound();
            });
          });

          this.listenBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (this.phase === 'solved') return;
            this.sound.unlock();
            this.playTargetPhase();
          });

          this.keyEls.forEach((keyEl) => {
            keyEl.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              e.stopPropagation();
              if (this.phase !== 'answer') return;
              this.sound.unlock();
              const noteId = keyEl.dataset.noteId;
              const freq = Number(keyEl.dataset.freq);

              keyEl.classList.add('is-pressed');
              setTimeout(() => keyEl.classList.remove('is-pressed'), 180);
              this.sound.playInstrumentNote('piano', freq, 0);

              if (noteId === this.targetId) {
                this.phase = 'solved';
                this.score++;
                this.scoreEl.innerHTML = `${FLAT_ICONS.star(22)}<span>${this.score}</span>`;
                const info = PQ_ALL_MAP[this.targetId];
                setTimeout(() => {
                  showCelebrationOverlay(this.rootEl, {
                    title: 'せいかい！',
                    subtitle: `「${info.label}」の おと だったよ！`,
                    centerHtml: FLAT_ICONS.note(60, '#FF595E'),
                    btnLabel: 'つぎの おとへ',
                    sound: this.sound,
                    onNext: () => this.startRound()
                  });
                }, 260);
              } else {
                keyEl.classList.remove('is-wrong-key');
                void keyEl.offsetWidth;
                keyEl.classList.add('is-wrong-key');
                setTimeout(() => keyEl.classList.remove('is-wrong-key'), 420);
                this.phasePill.textContent = 'もういっかい きいてみよう！';
              }
            });
          });

          this.startRound();
        }

        unmount() {
          clearTimeout(this.timer);
          this.container.innerHTML = '';
        }

        startRound() {
          clearTimeout(this.timer);
          const pool = PQ_LEVELS[this.level].notes;
          let next = pool[Math.floor(Math.random() * pool.length)];
          if (pool.length > 1 && next === this.targetId) {
            next = pool[(pool.indexOf(next) + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length];
          }
          this.targetId = next;
          this.playTargetPhase();
        }

        playTargetPhase() {
          clearTimeout(this.timer);
          this.phase = 'listen';
          this.pianoFrame.classList.add('pq-piano-locked');
          this.listenBtn.classList.add('is-playing');
          this.listenLabel.textContent = 'きいてね';
          this.phasePill.textContent = 'おとが なるよ…';

          const info = PQ_ALL_MAP[this.targetId];
          this.sound.playInstrumentNote('piano', info.freq, 0);

          this.timer = setTimeout(() => {
            this.phase = 'answer';
            this.listenBtn.classList.remove('is-playing');
            this.listenLabel.textContent = 'もういちど';
            this.pianoFrame.classList.remove('pq-piano-locked');
            this.phasePill.textContent = 'どの けんばん かな？ おしてね！';
          }, 950);
        }
      }

      /* =========================================================================
         2G. GAME 7: GEAR MACHINE (はぐるま マシン — Exact Meshing Physics Engine)
             Grid pitch = 96px, module m = 8px (R = 4 * T):
               S: T = 8,  R = 32px
               M: T = 12, R = 48px  (M+M = 96px exact mesh on orthogonal neighbors)
               L: T = 16, R = 64px  (S+L = 96px exact mesh on orthogonal neighbors)
         ========================================================================= */
      const GM_COLS = 6;
      const GM_ROWS = 4;
      const GM_STEP = 96;
      const GM_OX = 116;
      const GM_OY = 96;

      const GM_SPECS = {
        S: { teeth: 8,  r: 32, color: '#38BDF8', stroke: '#0284C7', label: 'しょう' },
        M: { teeth: 12, r: 48, color: '#FF924C', stroke: '#C85A17', label: 'ちゅう' },
        L: { teeth: 16, r: 64, color: '#A78BFA', stroke: '#6D28D9', label: 'だい' }
      };

      const GM_MACHINES = [
        { id: 'clock',    name: 'とけい' },
        { id: 'signal',   name: 'しんごうき' },
        { id: 'fan',      name: 'せんぷうき' },
        { id: 'musicbox', name: 'おるごーる' }
      ];

      /** Generate mathematically accurate gear tooth SVG path centered at (0,0) */
      function buildGearPath(teeth, pitchR) {
        const addendum = 6.2;
        const dedendum = 6.8;
        const rOut = pitchR + addendum;
        const rIn = Math.max(12, pitchR - dedendum);
        const step = (Math.PI * 2) / teeth;
        let d = '';
        for (let i = 0; i < teeth; i++) {
          const base = i * step;
          const a0 = base - step * 0.24;
          const a1 = base - step * 0.14;
          const a2 = base + step * 0.14;
          const a3 = base + step * 0.24;
          const a4 = base + step * 0.50;
          const p = (r, a) => `${(Math.cos(a) * r).toFixed(2)} ${(Math.sin(a) * r).toFixed(2)}`;
          d += (i === 0 ? `M ${p(rIn, a0)} ` : `L ${p(rIn, a0)} `);
          d += `L ${p(rOut, a1)} L ${p(rOut, a2)} L ${p(rIn, a3)} L ${p(rIn, a4)} `;
        }
        return d + 'Z';
      }

      const GM_GEAR_PATHS = {
        S: buildGearPath(GM_SPECS.S.teeth, GM_SPECS.S.r),
        M: buildGearPath(GM_SPECS.M.teeth, GM_SPECS.M.r),
        L: buildGearPath(GM_SPECS.L.teeth, GM_SPECS.L.r)
      };

      class GearMachineGame {
        constructor(container, app) {
          this.container = container;
          this.app = app;
          this.sound = app.sound;
          this.tool = 'M'; // 'S' | 'M' | 'L' | 'erase'
          this.gears = []; // { id, col, row, x, y, size, fixed, role, omega, phase }
          this.blocked = new Set(); // "col,row"
          this.machine = GM_MACHINES[0];
          this.jammed = false;
          this.goalPowered = false;
          this.solved = false;
          this.simTime = 0;
          this.lastFrame = 0;
          this.rafId = null;
          this.musicTick = 0;
          this.solveTimer = null;
        }

        mount() {
          this.app.setGameBackground('#0F766E');
          this.container.innerHTML = `
            <div class="gm-root" id="gm-root">
              <div class="lb-title-area" style="margin-top:2px;">
                <h2 class="lb-circuit-name"><ruby>GEAR MACHINE<rt>はぐるま マシン</rt></ruby></h2>
                <p class="lb-circuit-tip" id="gm-tip">はぐるま を つないで うごかそう！</p>
              </div>

              <div class="gm-viewport">
                <div class="gm-board" id="gm-board">
                  <svg class="gm-svg" id="gm-svg" viewBox="0 0 900 480"></svg>
                </div>
              </div>

              <div class="gm-dock" id="gm-dock">
                <button class="gm-tool-btn" type="button" data-tool="S">${FLAT_ICONS.gearMini(22, '#38BDF8')}<span>ちいさい</span></button>
                <button class="gm-tool-btn is-active" type="button" data-tool="M">${FLAT_ICONS.gearMini(28, '#FF924C')}<span>ふつう</span></button>
                <button class="gm-tool-btn" type="button" data-tool="L">${FLAT_ICONS.gearMini(34, '#A78BFA')}<span>おおきい</span></button>
                <button class="gm-tool-btn" type="button" data-tool="erase">${FLAT_ICONS.eraser(24)}<span>はずす</span></button>
                <button class="gm-tool-btn" type="button" id="gm-new-btn">${FLAT_ICONS.refresh(22)}<span>べつの おだい</span></button>
              </div>
            </div>
          `;

          this.rootEl = this.container.querySelector('#gm-root');
          this.tipEl = this.container.querySelector('#gm-tip');
          this.boardEl = this.container.querySelector('#gm-board');
          this.svgEl = this.container.querySelector('#gm-svg');
          this.toolBtns = Array.from(this.container.querySelectorAll('[data-tool]'));

          this.toolBtns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              this.tool = btn.dataset.tool;
              this.toolBtns.forEach((b) => b.classList.toggle('is-active', b === btn));
              this.sound.playButtonDown('yellow');
            });
          });

          this.container.querySelector('#gm-new-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.sound.playPageTurn(1);
            this.generatePuzzle();
          });

          this.generatePuzzle();
          this.lastFrame = performance.now();
          const loop = (now) => {
            const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
            this.lastFrame = now;
            this.tickAnimation(dt);
            this.rafId = requestAnimationFrame(loop);
          };
          this.rafId = requestAnimationFrame(loop);
        }

        unmount() {
          cancelAnimationFrame(this.rafId);
          clearTimeout(this.solveTimer);
          this.container.innerHTML = '';
        }

        pegCoords(col, row) {
          return { x: GM_OX + col * GM_STEP, y: GM_OY + row * GM_STEP };
        }

        /** Generate a guaranteed-solvable random puzzle with random goal machine */
        generatePuzzle() {
          clearTimeout(this.solveTimer);
          this.solved = false;
          this.goalPowered = false;
          this.jammed = false;
          this.musicTick = 0;

          // Pick random goal machine (different from previous if possible)
          const candidates = GM_MACHINES.filter((m) => m.id !== this.machine.id);
          this.machine = candidates[Math.floor(Math.random() * candidates.length)];

          const startRow = Math.floor(Math.random() * GM_ROWS);
          const goalRow = Math.floor(Math.random() * GM_ROWS);

          // Place 1-3 random blocked pegs while verifying orthogonal solvability via BFS
          let blocked = new Set();
          for (let attempt = 0; attempt < 25; attempt++) {
            const testBlocked = new Set();
            const numBlocks = 1 + Math.floor(Math.random() * 3);
            for (let k = 0; k < numBlocks; k++) {
              const bc = 1 + Math.floor(Math.random() * (GM_COLS - 2));
              const br = Math.floor(Math.random() * GM_ROWS);
              testBlocked.add(`${bc},${br}`);
            }
            if (this.hasOrthogonalPath(0, startRow, GM_COLS - 1, goalRow, testBlocked)) {
              blocked = testBlocked;
              break;
            }
          }
          this.blocked = blocked;

          const startPos = this.pegCoords(0, startRow);
          const goalPos = this.pegCoords(GM_COLS - 1, goalRow);

          this.gears = [
            { id: 'start', col: 0, row: startRow, x: startPos.x, y: startPos.y, size: 'M', fixed: true, role: 'start', omega: 1.4, phase: 0 },
            { id: 'goal',  col: GM_COLS - 1, row: goalRow, x: goalPos.x, y: goalPos.y, size: 'M', fixed: true, role: 'goal', omega: 0, phase: 0 }
          ];

          this.tipEl.textContent = `はぐるま を つないで「${this.machine.name}」を うごかそう！`;
          this.solveNetwork();
          this.renderSvg();
        }

        hasOrthogonalPath(sc, sr, gc, gr, blocked) {
          const q = [[sc, sr]];
          const seen = new Set([`${sc},${sr}`]);
          const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          while (q.length > 0) {
            const [c, r] = q.shift();
            if (c === gc && r === gr) return true;
            for (const [dc, dr] of dirs) {
              const nc = c + dc, nr = r + dr;
              const key = `${nc},${nr}`;
              if (nc >= 0 && nc < GM_COLS && nr >= 0 && nr < GM_ROWS && !blocked.has(key) && !seen.has(key)) {
                seen.add(key);
                q.push([nc, nr]);
              }
            }
          }
          return false;
        }

        /** Check strict non-overlapping physical clearance */
        canPlaceAt(col, row, size) {
          if (this.blocked.has(`${col},${row}`)) return false;
          const pos = this.pegCoords(col, row);
          const rNew = GM_SPECS[size].r;
          for (const g of this.gears) {
            if (g.col === col && g.row === row) continue;
            const dist = Math.hypot(g.x - pos.x, g.y - pos.y);
            const minDist = rNew + GM_SPECS[g.size].r - 1.5;
            if (dist < minDist) return false;
          }
          return true;
        }

        /** Exact BFS gear meshing, gear-ratio angular velocity, phase alignment & jam detection */
        solveNetwork() {
          for (const g of this.gears) {
            g.omega = 0;
            g.visited = false;
          }
          this.jammed = false;

          const startGear = this.gears.find((g) => g.role === 'start');
          if (!startGear) return;

          startGear.omega = 1.45;
          startGear.phase = 0;
          startGear.visited = true;

          const queue = [startGear];
          const MESH_TOL = 2.0;

          while (queue.length > 0 && !this.jammed) {
            const cur = queue.shift();
            const curSpec = GM_SPECS[cur.size];

            for (const nxt of this.gears) {
              if (nxt === cur) continue;
              const nxtSpec = GM_SPECS[nxt.size];
              const dist = Math.hypot(nxt.x - cur.x, nxt.y - cur.y);
              const ideal = curSpec.r + nxtSpec.r;

              if (Math.abs(dist - ideal) <= MESH_TOL) {
                const expectedOmega = -cur.omega * (curSpec.teeth / nxtSpec.teeth);
                const theta = Math.atan2(nxt.y - cur.y, nxt.x - cur.x);
                const expectedPhase = theta + Math.PI + (Math.PI / nxtSpec.teeth) - (cur.phase - theta) * (curSpec.teeth / nxtSpec.teeth);

                if (!nxt.visited) {
                  nxt.visited = true;
                  nxt.omega = expectedOmega;
                  nxt.phase = expectedPhase;
                  queue.push(nxt);
                } else if (Math.abs(nxt.omega - expectedOmega) > 0.02) {
                  // Odd-cycle mechanical jam detected!
                  this.jammed = true;
                  break;
                }
              }
            }
          }

          if (this.jammed) {
            for (const g of this.gears) g.omega = 0;
            this.goalPowered = false;
            this.boardEl.classList.remove('is-jammed');
            void this.boardEl.offsetWidth;
            this.boardEl.classList.add('is-jammed');
            this.tipEl.textContent = 'はぐるま が ぶつかって とまったよ！ 1つ はずしてみてね';
            this.sound.playGentleNudge();
            return;
          }

          const goalGear = this.gears.find((g) => g.role === 'goal');
          this.goalPowered = !!(goalGear && Math.abs(goalGear.omega) > 0.01);

          if (this.goalPowered && !this.solved) {
            this.solved = true;
            this.tipEl.textContent = `やったね！「${this.machine.name}」が うごいたよ！`;
            this.sound.playSuccessFanfare();
            clearTimeout(this.solveTimer);
            this.solveTimer = setTimeout(() => {
              showCelebrationOverlay(this.rootEl, {
                title: 'うごいたよ！',
                subtitle: `「${this.machine.name}」が かんせい！`,
                centerHtml: FLAT_ICONS.gearMini(64, '#FFD12E'),
                btnLabel: 'つぎの マシンへ',
                sound: this.sound,
                onNext: () => this.generatePuzzle()
              });
            }, 1250);
          } else if (!this.goalPowered) {
            this.tipEl.textContent = `はぐるま を つないで「${this.machine.name}」を うごかそう！`;
          }
        }

        handlePegTap(col, row) {
          if (this.solved) return;
          this.sound.unlock();
          if (this.blocked.has(`${col},${row}`)) {
            this.sound.playGentleNudge();
            return;
          }

          const existingIdx = this.gears.findIndex((g) => g.col === col && g.row === row);
          if (existingIdx >= 0) {
            const g = this.gears[existingIdx];
            if (g.fixed) {
              this.sound.playButtonDown('yellow');
              return;
            }
            if (this.tool === 'erase' || g.size === this.tool) {
              this.gears.splice(existingIdx, 1);
              this.sound.playGearRemove();
              this.solveNetwork();
              this.renderSvg();
              return;
            }
            // Replace with different size if clearance allows
            if (this.canPlaceAt(col, row, this.tool)) {
              g.size = this.tool;
              this.sound.playGearSnap(this.tool);
              this.solveNetwork();
              this.renderSvg();
            } else {
              this.sound.playGentleNudge();
              this.boardEl.classList.remove('is-jammed');
              void this.boardEl.offsetWidth;
              this.boardEl.classList.add('is-jammed');
            }
            return;
          }

          if (this.tool === 'erase') return;

          if (this.canPlaceAt(col, row, this.tool)) {
            const pos = this.pegCoords(col, row);
            this.gears.push({
              id: `g_${col}_${row}`,
              col, row, x: pos.x, y: pos.y,
              size: this.tool,
              fixed: false,
              role: 'user',
              omega: 0,
              phase: 0
            });
            this.sound.playGearSnap(this.tool);
            this.solveNetwork();
            this.renderSvg();
          } else {
            // Physically blocked by adjacent gear overlap
            this.sound.playGentleNudge();
            this.boardEl.classList.remove('is-jammed');
            void this.boardEl.offsetWidth;
            this.boardEl.classList.add('is-jammed');
          }
        }

        renderGoalMachineSvg(goalY) {
          const m = this.machine.id;
          const cx = 775;
          const cy = 240;
          const shaft = `
            <path d="M ${GM_OX + (GM_COLS - 1) * GM_STEP} ${goalY} L 685 ${goalY} L 685 ${cy} L 710 ${cy}"
                  fill="none" stroke="${this.goalPowered ? '#FFD12E' : 'rgba(255,255,255,0.45)'}"
                  stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          `;

          if (m === 'clock') {
            return `
              ${shaft}
              <g id="gm-machine">
                <circle cx="${cx}" cy="${cy}" r="74" fill="#FFFFFF" stroke="#FFD12E" stroke-width="10"/>
                <circle cx="${cx}" cy="${cy - 54}" r="5" fill="#94A3B8"/>
                <circle cx="${cx + 54}" cy="${cy}" r="5" fill="#94A3B8"/>
                <circle cx="${cx}" cy="${cy + 54}" r="5" fill="#94A3B8"/>
                <circle cx="${cx - 54}" cy="${cy}" r="5" fill="#94A3B8"/>
                <line id="gm-clock-h" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 32}" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
                <line id="gm-clock-m" x1="${cx}" y1="${cy}" x2="${cx + 44}" y2="${cy}" stroke="#FF595E" stroke-width="6" stroke-linecap="round"/>
                <circle cx="${cx}" cy="${cy}" r="8" fill="#1E293B"/>
              </g>
            `;
          }

          if (m === 'signal') {
            return `
              ${shaft}
              <g id="gm-machine">
                <rect x="${cx - 46}" y="${cy - 102}" width="92" height="204" rx="28" fill="#1E293B" stroke="#FFFFFF" stroke-width="7"/>
                <circle id="gm-sig-r" cx="${cx}" cy="${cy - 58}" r="23" fill="#475569"/>
                <circle id="gm-sig-y" cx="${cx}" cy="${cy}"      r="23" fill="#475569"/>
                <circle id="gm-sig-g" cx="${cx}" cy="${cy + 58}" r="23" fill="#475569"/>
              </g>
            `;
          }

          if (m === 'fan') {
            return `
              ${shaft}
              <g id="gm-machine">
                <rect x="${cx - 12}" y="${cy + 40}" width="24" height="62" rx="10" fill="#CBD5E1"/>
                <rect x="${cx - 46}" y="${cy + 92}" width="92" height="18" rx="9" fill="#FFFFFF"/>
                <circle cx="${cx}" cy="${cy}" r="74" fill="rgba(255,255,255,0.18)" stroke="#FFFFFF" stroke-width="8"/>
                <g id="gm-fan-blades" transform="translate(${cx}, ${cy})">
                  <ellipse cx="0" cy="-34" rx="16" ry="30" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
                  <ellipse cx="0" cy="34"  rx="16" ry="30" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
                  <ellipse cx="-34" cy="0" rx="30" ry="16" fill="#67E8F9" stroke="#FFFFFF" stroke-width="4"/>
                  <ellipse cx="34"  cy="0" rx="30" ry="16" fill="#67E8F9" stroke="#FFFFFF" stroke-width="4"/>
                  <circle cx="0" cy="0" r="14" fill="#FFD12E" stroke="#FFFFFF" stroke-width="4"/>
                </g>
              </g>
            `;
          }

          // 'musicbox'
          return `
            ${shaft}
            <g id="gm-machine">
              <rect x="${cx - 64}" y="${cy - 44}" width="128" height="96" rx="22" fill="#FF85B3" stroke="#FFFFFF" stroke-width="7"/>
              <rect x="${cx - 46}" y="${cy - 22}" width="92" height="52" rx="12" fill="#FFF1F2"/>
              <g id="gm-music-note" transform="translate(${cx}, ${cy})">
                <path d="M-8 14 V-12 L14 -17 V9" stroke="#FF4757" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="-13" cy="14" r="7" fill="#FF4757"/>
                <circle cx="9" cy="9" r="7" fill="#FF4757"/>
              </g>
            </g>
          `;
        }

        renderSvg() {
          let pegsHtml = '';
          for (let r = 0; r < GM_ROWS; r++) {
            for (let c = 0; c < GM_COLS; c++) {
              const { x, y } = this.pegCoords(c, r);
              const isBlocked = this.blocked.has(`${c},${r}`);
              if (isBlocked) {
                pegsHtml += `
                  <g>
                    <circle cx="${x}" cy="${y}" r="22" fill="rgba(15,23,42,0.45)" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>
                    <line x1="${x - 9}" y1="${y - 9}" x2="${x + 9}" y2="${y + 9}" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
                    <line x1="${x + 9}" y1="${y - 9}" x2="${x - 9}" y2="${y + 9}" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
                  </g>
                `;
              } else {
                pegsHtml += `
                  <circle cx="${x}" cy="${y}" r="11" fill="rgba(255,255,255,0.38)" stroke="rgba(255,255,255,0.65)" stroke-width="3"/>
                `;
              }
            }
          }

          let gearsHtml = '';
          this.gears.forEach((g) => {
            const spec = GM_SPECS[g.size];
            const fill = g.role === 'start' ? '#FFD12E' : (g.role === 'goal' ? '#4ADE80' : spec.color);
            const stroke = g.role === 'start' ? '#B45309' : (g.role === 'goal' ? '#15803D' : spec.stroke);
            const innerR = Math.max(11, spec.r * 0.42);
            gearsHtml += `
              <g transform="translate(${g.x}, ${g.y})">
                <g class="gm-gear-rot" data-gear-id="${g.id}">
                  <path d="${GM_GEAR_PATHS[g.size]}" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
                  <circle cx="0" cy="0" r="${innerR}" fill="#FFFFFF" opacity="0.35"/>
                  <circle cx="${(innerR * 0.58).toFixed(1)}" cy="0" r="5" fill="#FFFFFF"/>
                  <circle cx="${(-innerR * 0.58).toFixed(1)}" cy="0" r="5" fill="#FFFFFF"/>
                  <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="${stroke}" stroke-width="3.5"/>
                </g>
                ${g.role === 'start' ? `<text x="0" y="${spec.r + 24}" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900">スタート</text>` : ''}
                ${g.role === 'goal'  ? `<text x="0" y="${spec.r + 24}" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900">ゴール</text>` : ''}
              </g>
            `;
          });

          // Interactive peg hit targets on top
          let hitsHtml = '';
          for (let r = 0; r < GM_ROWS; r++) {
            for (let c = 0; c < GM_COLS; c++) {
              const { x, y } = this.pegCoords(c, r);
              hitsHtml += `<circle class="gm-peg-hit" cx="${x}" cy="${y}" r="44" data-col="${c}" data-row="${r}"/>`;
            }
          }

          const goalGear = this.gears.find((g) => g.role === 'goal');
          const goalY = goalGear ? goalGear.y : 240;

          this.svgEl.innerHTML = `
            ${pegsHtml}
            ${this.renderGoalMachineSvg(goalY)}
            ${gearsHtml}
            ${hitsHtml}
          `;

          this.svgEl.querySelectorAll('.gm-peg-hit').forEach((el) => {
            el.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.handlePegTap(Number(el.dataset.col), Number(el.dataset.row));
            });
          });

          this.applyGearTransforms();
        }

        applyGearTransforms() {
          for (const g of this.gears) {
            const el = this.svgEl.querySelector(`[data-gear-id="${g.id}"]`);
            if (!el) continue;
            const angleRad = g.phase + g.omega * this.simTime;
            const angleDeg = (angleRad * 180) / Math.PI;
            el.setAttribute('transform', `rotate(${angleDeg.toFixed(2)})`);
          }
        }

        tickAnimation(dt) {
          this.simTime += dt;
          this.applyGearTransforms();

          if (!this.goalPowered) return;

          const m = this.machine.id;
          if (m === 'clock') {
            const hEl = this.svgEl.querySelector('#gm-clock-h');
            const mEl = this.svgEl.querySelector('#gm-clock-m');
            if (hEl && mEl) {
              const degM = (this.simTime * 190) % 360;
              const degH = (this.simTime * 28) % 360;
              mEl.setAttribute('transform', `rotate(${degM.toFixed(1)} 775 240)`);
              hEl.setAttribute('transform', `rotate(${degH.toFixed(1)} 775 240)`);
            }
          } else if (m === 'signal') {
            const idx = Math.floor(this.simTime * 2.2) % 3;
            const rEl = this.svgEl.querySelector('#gm-sig-r');
            const yEl = this.svgEl.querySelector('#gm-sig-y');
            const gEl = this.svgEl.querySelector('#gm-sig-g');
            if (rEl && yEl && gEl) {
              rEl.setAttribute('fill', idx === 0 ? '#FF4757' : '#475569');
              yEl.setAttribute('fill', idx === 1 ? '#FFD32A' : '#475569');
              gEl.setAttribute('fill', idx === 2 ? '#2ED573' : '#475569');
            }
          } else if (m === 'fan') {
            const fEl = this.svgEl.querySelector('#gm-fan-blades');
            if (fEl) {
              const deg = (this.simTime * 420) % 360;
              fEl.setAttribute('transform', `translate(775, 240) rotate(${deg.toFixed(1)})`);
            }
          } else if (m === 'musicbox') {
            const nEl = this.svgEl.querySelector('#gm-music-note');
            if (nEl) {
              const bob = Math.sin(this.simTime * 7) * 9;
              nEl.setAttribute('transform', `translate(775, ${(240 + bob).toFixed(1)})`);
            }
          }
        }
      }

      /* =========================================================================
         4. APP SHELL (Navigation, Single-Tap Close, Sound Toggle, iPad Touch Guard)
         ========================================================================= */
      class AppShell {
        constructor() {
          this.sound = new SoundEngine();
          this.activeGame = null;
          this.homeScreen = document.getElementById('home-screen');
          this.gameScreen = document.getElementById('game-screen');
          this.gameGrid = document.getElementById('game-grid');
          this.gameMount = document.getElementById('game-mount');
          this.closeGameBtn = document.getElementById('close-game-btn');

          this.initTouchGuards();
          this.initSoundButtons();
          this.initCloseButton();
          this.renderMenu();
        }

        initTouchGuards() {
          // Unlock audio on very first touch anywhere
          const unlockOnce = () => {
            this.sound.unlock();
          };
          window.addEventListener('pointerdown', unlockOnce, { passive: true });
          window.addEventListener('touchstart', unlockOnce, { passive: true });

          // Block iOS Safari pinch/double-tap zoom & long-press menu
          document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('contextmenu', (e) => e.preventDefault());
          document.addEventListener('dblclick', (e) => e.preventDefault());
        }

        initSoundButtons() {
          const btns = document.querySelectorAll('.js-sound-toggle');
          const syncUI = (muted) => {
            btns.forEach((btn) => {
              btn.classList.toggle('is-muted', muted);
              btn.querySelector('.icon-sound-on').style.display = muted ? 'none' : 'block';
              btn.querySelector('.icon-sound-off').style.display = muted ? 'block' : 'none';
            });
          };

          btns.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              const muted = this.sound.toggleMute();
              syncUI(muted);
              if (!muted) {
                this.sound.playButtonUp('yellow');
              }
            });
          });
        }

        initCloseButton() {
          this.closeGameBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.sound.unlock();
            this.closeGameBtn.classList.add('is-pressed');
            this.sound.playPageTurn(-1);
            setTimeout(() => {
              this.closeGameBtn.classList.remove('is-pressed');
              this.exitGame();
            }, 90);
          });
        }

        renderMenu() {
          this.gameGrid.innerHTML = '';
          GAME_REGISTRY.forEach((item) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = `game-card ${item.available ? '' : 'is-coming-soon'}`;
            card.style.setProperty('--card-bg', item.bg);
            card.style.setProperty('--card-shadow', item.shadow);

            card.innerHTML = `
              <span class="card-badge">${item.badge}</span>
              <div class="card-icon-wrap">${item.iconSvg}</div>
              <div>
                <h2 class="card-title"><ruby>${item.title}<rt>${item.ruby}</rt></ruby></h2>
                <p class="card-desc">${item.desc}</p>
              </div>
              <span class="card-play-pill">
                ${item.available ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><polygon points="3,2 14,8 3,14"/></svg>' : ''}${item.cta}
              </span>
            `;

            // Use 'click' so vertical touch-scrolling on iPad/iPhone never triggers accidental launches
            card.addEventListener('click', () => {
              this.sound.unlock();
              if (item.available) {
                card.classList.add('is-pressed');
                this.sound.playMenuSelect();
                setTimeout(() => {
                  card.classList.remove('is-pressed');
                  this.launchGame(item);
                }, 120);
              } else {
                this.sound.playBoing();
                card.classList.remove('is-boing');
                void card.offsetWidth;
                card.classList.add('is-boing');
              }
            });

            this.gameGrid.appendChild(card);
          });
        }

        setGameBackground(color) {
          this.gameScreen.style.backgroundColor = color;
        }

        launchGame(item) {
          if (this.activeGame) {
            this.activeGame.unmount();
            this.activeGame = null;
          }
          this.activeGame = item.create(this.gameMount, this);
          this.activeGame.mount();

          this.homeScreen.classList.add('is-hidden');
          this.gameScreen.classList.remove('is-hidden');
        }

        exitGame() {
          this.gameScreen.classList.add('is-hidden');
          this.homeScreen.classList.remove('is-hidden');
          setTimeout(() => {
            if (this.activeGame) {
              this.activeGame.unmount();
              this.activeGame = null;
            }
          }, 350);
        }
      }

      // Boot application (works whether DOM is still loading or already interactive)
      function bootApp() {
        try {
          if (!window.__ygenApp) {
            window.__ygenApp = new AppShell();
          }
        } catch (err) {
          const grid = document.getElementById('game-grid');
          if (grid) {
            grid.innerHTML = `<div class="noscript-banner" style="grid-column:1/-1;">起動エラー: ${String(err && err.message ? err.message : err)}</div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootApp);
      } else {
        bootApp();
      }
    })();
