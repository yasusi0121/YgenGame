<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="あそびば" />
  <meta name="theme-color" content="#FF7043" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>ちいく あそびば — LOGIC BOOK</title>
  <style>
    :root {
      --font-rounded: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "BIZ UDGothic", "Rounded Mplus 1c", "Arial Rounded MT Bold", ui-rounded, system-ui, -apple-system, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      font-family: var(--font-rounded);
      background: #FFF8EC;
      color: #2D3436;
      overscroll-behavior: none;
    }

    /* Ruby styling (clean hiragana furigana) */
    ruby {
      ruby-align: center;
      ruby-position: over;
    }
    rt {
      font-size: 0.42em;
      font-weight: 800;
      letter-spacing: 0.06em;
      opacity: 0.92;
      line-height: 1.2;
    }

    /* App Container */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* ============================================================
       HOME MENU SCREEN (Lingokids-inspired Flat Toy Design)
       ============================================================ */
    #home-screen {
      background: #FFF7E8;
      padding: calc(18px + var(--safe-top)) calc(24px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(24px + var(--safe-left));
      justify-content: space-between;
      align-items: center;
    }

    .home-bg-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
    }
    .bg-blob-1 { width: 340px; height: 340px; background: #FFE29A; top: -110px; left: -90px; }
    .bg-blob-2 { width: 280px; height: 280px; background: #B8E8FC; top: -60px; right: -70px; }
    .bg-blob-3 { width: 320px; height: 320px; background: #FFD1DC; bottom: -120px; left: 15%; }
    .bg-blob-4 { width: 260px; height: 260px; background: #C8F2D6; bottom: -90px; right: 8%; }

    .home-header {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1060px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #FFFFFF;
      padding: 10px 22px 10px 14px;
      border-radius: 999px;
      border: 4px solid #FFE2B3;
      box-shadow: 0 6px 0 #F2D29B;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FF7043;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 #D84315;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 900;
      color: #2D3436;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .brand-sub {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #FF7043;
      letter-spacing: 0.06em;
    }

    /* Flat Toy Icon Button (Sound / Back / etc.) */
    .toy-icon-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: #FFFFFF;
      color: #2D3436;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .toy-icon-btn:active,
    .toy-icon-btn.is-pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
    }

    .toy-icon-btn.is-muted {
      background: #E2E8F0;
      color: #64748B;
    }

    /* Menu Main Area (Scrollable for growing game library) */
    .home-main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1080px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: clamp(12px, 2vh, 22px);
      padding: 8px 0 0;
      overflow: hidden;
    }

    .home-prompt {
      margin: 0;
      font-size: clamp(20px, 2.6vw, 30px);
      font-weight: 900;
      color: #3D405B;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      padding: 10px 28px;
      border-radius: 999px;
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 0 rgba(61, 64, 91, 0.08);
      flex-shrink: 0;
    }

    .game-grid {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(16px, 2.2vw, 26px);
      align-content: start;
      align-items: stretch;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 6px 8px 36px;
    }

    /* iPad Portrait (e.g. 768x1024): 2 clean columns, scrollable */
    @media (max-width: 900px) and (orientation: portrait) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 700px;
      }
    }

    /* Phone Portrait: single column, scrollable */
    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
        max-width: 420px;
        padding: 4px 6px 32px;
      }
    }

    .noscript-banner {
      background: #FFFFFF;
      color: #C0392B;
      border: 4px solid #FFCDD2;
      border-radius: 24px;
      padding: 20px 26px;
      max-width: 520px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.6;
      box-shadow: 0 8px 0 rgba(192, 57, 43, 0.12);
    }

    .game-card {
      position: relative;
      border: 5px solid #FFFFFF;
      border-radius: 32px;
      padding: clamp(18px, 2.4vw, 26px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 14px;
      cursor: pointer;
      color: #FFFFFF;
      background: var(--card-bg, #FF7043);
      box-shadow: 0 10px 0 var(--card-shadow, #D84315), 0 16px 28px rgba(45, 52, 54, 0.12);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
      min-height: clamp(240px, 38vh, 330px);
    }

    .game-card:active,
    .game-card.is-pressed {
      transform: translateY(7px) scale(0.98);
      box-shadow: 0 3px 0 var(--card-shadow, #D84315), 0 6px 12px rgba(45, 52, 54, 0.10);
    }

    .game-card.is-coming-soon {
      background: var(--card-bg, #A5B4FC);
      color: #FFFFFF;
      opacity: 0.94;
    }

    .game-card.is-boing {
      animation: cardBoing 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardBoing {
      0% { transform: scale(1); }
      30% { transform: scale(1.06, 0.93); }
      55% { transform: scale(0.96, 1.04); }
      80% { transform: scale(1.02, 0.98); }
      100% { transform: scale(1); }
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: #FFD12E;
      color: #5C3D00;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #D9A700;
      letter-spacing: 0.04em;
    }

    .game-card.is-coming-soon .card-badge {
      background: #FFFFFF;
      color: #5B6770;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    }

    .card-icon-wrap {
      width: clamp(92px, 12vw, 126px);
      height: clamp(92px, 12vw, 126px);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
      margin-top: 10px;
    }

    .card-title {
      margin: 0;
      font-size: clamp(22px, 2.5vw, 30px);
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .card-title rt {
      font-size: 0.48em;
      color: rgba(255, 255, 255, 0.95);
    }

    .card-desc {
      margin: 0;
      font-size: clamp(13px, 1.5vw, 16px);
      font-weight: 800;
      opacity: 0.92;
      line-height: 1.4;
    }

    .card-play-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      color: var(--card-shadow, #D84315);
      font-size: clamp(15px, 1.7vw, 18px);
      font-weight: 900;
      padding: 10px 26px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.14);
    }

    .game-card.is-coming-soon .card-play-pill {
      background: rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      box-shadow: none;
    }

    .home-footer {
      position: relative;
      z-index: 2;
      font-size: 13px;
      font-weight: 800;
      color: #7F8C8D;
      text-align: center;
    }

    /* ============================================================
       GAME SHELL SCREEN (Shared Chrome for All Games)
       ============================================================ */
    #game-screen {
      background: #EB5A3C;
      transition: background-color 0.42s ease, opacity 0.35s ease, transform 0.35s ease;
    }

    .game-topbar {
      position: absolute;
      top: calc(14px + var(--safe-top));
      left: calc(18px + var(--safe-left));
      right: calc(18px + var(--safe-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      pointer-events: none;
    }

    .game-topbar > * {
      pointer-events: auto;
    }

    /* Single-tap Close (X) button */
    .close-game-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      color: #2D3436;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.16);
      padding: 0;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .close-game-btn:active,
    .close-game-btn.is-pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
    }

    #game-mount {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ============================================================
       GAME 1: LOGIC BOOK (Computer Engineering for Babies)
       ============================================================ */
    .lb-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + var(--safe-top)) calc(20px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(20px + var(--safe-left));
      overflow: hidden;
    }

    /* Optional flat PCB background pattern for XOR & LATCH */
    .lb-pcb-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .lb-pcb-bg.is-visible {
      opacity: 1;
    }

    /* Stage Header Badge (Center Top) */
    .lb-stage-header {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      pointer-events: none;
    }

    .lb-stage-pill {
      background: rgba(255, 255, 255, 0.22);
      border: 3px solid rgba(255, 255, 255, 0.45);
      color: #FFFFFF;
      font-size: clamp(13px, 1.6vw, 16px);
      font-weight: 900;
      padding: 5px 18px;
      border-radius: 999px;
      letter-spacing: 0.06em;
    }

    .lb-root.is-light-bg .lb-stage-pill {
      background: rgba(45, 52, 54, 0.12);
      border-color: rgba(45, 52, 54, 0.22);
      color: #3B2E00;
    }

    /* Main Interactive Board Stage (Fixed Aspect Ratio so SVG wires, buttons, LED never drift) */
    .lb-stage-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .lb-board {
      position: relative;
      width: min(92vw, 940px, calc(66dvh * 1.85));
      aspect-ratio: 900 / 480;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }

    .lb-board.slide-out-left {
      transform: translateX(-50px) scale(0.96);
      opacity: 0;
    }
    .lb-board.slide-out-right {
      transform: translateX(50px) scale(0.96);
      opacity: 0;
    }

    .lb-circuit-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* SVG Wire Styles */
    .wire-base {
      fill: none;
      stroke: rgba(255, 255, 255, 0.42);
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .lb-root.is-light-bg .wire-base {
      stroke: rgba(59, 46, 0, 0.28);
    }

    .wire-power {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.14s ease;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
    }

    .wire-power.is-on {
      opacity: 1;
    }

    .wire-pulse {
      fill: none;
      stroke: #FFF7A8;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 14 26;
      opacity: 0;
      transition: opacity 0.14s ease;
      animation: wireFlow 0.75s linear infinite;
    }

    .wire-pulse.is-on {
      opacity: 1;
    }

    @keyframes wireFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }

    /* Gate shapes */
    .gate-body {
      fill: rgba(255, 255, 255, 0.18);
      stroke: #FFFFFF;
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.18s ease, filter 0.18s ease;
    }

    .lb-root.is-light-bg .gate-body {
      fill: rgba(255, 255, 255, 0.48);
      stroke: #3B2E00;
    }

    .gate-body.is-active {
      fill: rgba(255, 255, 255, 0.55);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.75));
    }

    .lb-root.is-light-bg .gate-body.is-active {
      fill: #FFFFFF;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95));
    }

    .gnd-line {
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .lb-root.is-light-bg .gnd-line {
      stroke: #3B2E00;
    }

    /* Tactile 3D-Flat Toy Push Button */
    .toy-push-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 17.5%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 1.1%;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2), 0 16px 24px rgba(0, 0, 0, 0.16);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      z-index: 12;
    }

    .toy-push-btn-well {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--btn-well, #B58900);
      display: grid;
      place-items: center;
    }

    .toy-push-btn-cap {
      position: relative;
      width: 92%;
      height: 92%;
      border-radius: 50%;
      background: var(--btn-color, #FFD12E);
      box-shadow: 0 10px 0 var(--btn-depth, #D99B00), inset 0 -4px 0 rgba(0, 0, 0, 0.08);
      transform: translateY(-6px);
      transition: transform 0.07s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.07s ease, filter 0.1s ease;
      display: grid;
      place-items: center;
    }

    /* Flat glossy highlight on button cap */
    .toy-push-btn-cap::before {
      content: "";
      position: absolute;
      top: 13%;
      left: 19%;
      width: 30%;
      height: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-28deg);
      pointer-events: none;
    }

    .toy-push-btn.is-pressed .toy-push-btn-cap {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 2px 0 var(--btn-depth, #D99B00), inset 0 2px 0 rgba(0, 0, 0, 0.1);
      filter: brightness(1.06);
    }

    .toy-push-btn.btn-yellow {
      --btn-color: #FFD230;
      --btn-depth: #D69600;
      --btn-well: #9E6E00;
    }

    .toy-push-btn.btn-red {
      --btn-color: #FF4747;
      --btn-depth: #C81E2B;
      --btn-well: #8C131C;
    }

    /* Ripple effect on button press */
    .btn-ripple {
      position: absolute;
      inset: -14%;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.85);
      opacity: 0;
      pointer-events: none;
    }

    .toy-push-btn.is-pressed .btn-ripple {
      animation: btnRippleOut 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes btnRippleOut {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    /* Button Side Label (for LATCH: RESET / SET) */
    .btn-side-label {
      position: absolute;
      transform: translate(-100%, -50%);
      padding-right: 14px;
      text-align: right;
      color: #FFFFFF;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 22px);
      line-height: 1.2;
      letter-spacing: 0.05em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 11;
    }

    .btn-side-label rt {
      font-size: 0.56em;
      color: rgba(255, 255, 255, 0.88);
    }

    /* LED Lamp Component */
    .toy-led {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 11.2%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 0.95%;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.22);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 12;
    }

    .toy-led-bulb {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--led-off, #3B4252);
      transition: background 0.12s ease, box-shadow 0.16s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toy-led-bulb::before {
      content: "";
      position: absolute;
      top: 16%;
      left: 20%;
      width: 28%;
      height: 20%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(-25deg);
    }

    .toy-led.is-on .toy-led-bulb {
      background: var(--led-on, #4ADE80);
      transform: scale(1.08);
      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.45),
        0 0 28px 10px var(--led-glow, rgba(74, 222, 128, 0.9)),
        0 0 58px 20px var(--led-glow, rgba(74, 222, 128, 0.55));
    }

    /* Sparkle Rays around LED when ON */
    .led-sparkles {
      position: absolute;
      inset: -55%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5) rotate(-15deg);
      transition: opacity 0.18s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toy-led.is-on .led-sparkles {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: sparkleFloat 2.2s ease-in-out infinite;
    }

    @keyframes sparkleFloat {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.09) rotate(8deg); }
    }

    /* Big Title & Furigana below circuit */
    .lb-title-area {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 4px;
      pointer-events: none;
      margin-top: 6px;
      padding: 0 64px;
    }

    .lb-circuit-name {
      margin: 0;
      font-size: clamp(30px, 4.8vw, 54px);
      font-weight: 900;
      color: #FFFFFF;

    /* Tactile 3D Seesaw Rocker Switch (distinct from round push buttons) */
    .toy-rocker {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 12.6%;
      aspect-ratio: 100 / 154;
      border-radius: 22px;
      background: #F8FAFC;
      padding: 0.9%;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.24), 0 16px 24px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      touch-action: none;
      z-index: 14;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 260px;
    }

    .toy-rocker-well {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      background: #1E242B;
      padding: 7%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.55);
      transform-style: preserve-3d;
    }

    .toy-rocker-paddle {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 11px;
      background: linear-gradient(180deg, var(--sw-top-off) 0%, var(--sw-mid-off) 50%, var(--sw-bot-off) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14% 0;
      /* OFF state: bottom tilted OUT toward user, top pushed IN */
      transform: rotateX(-20deg) translateY(3px);
      transform-origin: center center;
      box-shadow:
        0 -8px 0 var(--sw-edge, #7A141A),
        0 3px 6px rgba(0, 0, 0, 0.35),
        inset 0 -10px 0 rgba(255, 255, 255, 0.22),
        inset 0 6px 8px rgba(0, 0, 0, 0.32);
      transition: transform 0.13s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.13s ease, background 0.13s ease;
    }

    /* Center pivot crease line so seesaw axis is unmistakable */
    .toy-rocker-paddle::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }

    /* ON state: top tilted OUT toward user, bottom pushed IN */
    .toy-rocker.is-on .toy-rocker-paddle {
      background: linear-gradient(180deg, var(--sw-top-on) 0%, var(--sw-mid-on) 50%, var(--sw-bot-on) 100%);
      transform: rotateX(20deg) translateY(-3px);
      box-shadow:
        0 9px 0 var(--sw-edge, #961920),
        0 12px 14px rgba(0, 0, 0, 0.28),
        inset 0 8px 0 rgba(255, 255, 255, 0.35),
        inset 0 -8px 8px rgba(0, 0, 0, 0.24);
    }

    .toy-rocker:active .toy-rocker-paddle {
      transform: scale(0.95);
    }

    .toy-rocker.sw-red {
      --sw-top-on: #FF6B6B;
      --sw-mid-on: #FF3B3B;
      --sw-bot-on: #D92323;
      --sw-top-off: #9C2228;
      --sw-mid-off: #BD2C33;
      --sw-bot-off: #E03E45;
      --sw-edge: #7A141A;
    }

    .toy-rocker.sw-yellow {
      --sw-top-on: #FFE46B;
      --sw-mid-on: #FFD026;
      --sw-bot-on: #E0A400;
      --sw-top-off: #9C7400;
      --sw-mid-off: #BD8F00;
      --sw-bot-off: #DEA900;
      --sw-edge: #7A5800;
    }

    .rocker-mark-on {
      width: 44%;
      height: 11%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      transition: background 0.14s ease, box-shadow 0.14s ease;

    .toy-rocker.is-on .rocker-mark-on {

    .rocker-mark-off {

      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.72);
      opacity: 0.92;
    }

    .toy-rocker.is-on .rocker-mark-off {
      opacity: 0.35;
    }

      width: 50px;
      height: 50px;
      padding: 0;
      border: none;
      border-radius: 16px;
      background: var(--s-bg, #FF7043);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 4px 0 var(--s-sh, #D84315);
      cursor: pointer;
    }

    .pm-step-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--s-sh, #D84315); }

    .pm-merge-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 5px solid #FFFFFF;
      border-radius: 999px;
      background: #FFD12E;
      color: #4D3300;
      font-family: var(--font-rounded);
      font-size: clamp(18px, 2.3vw, 24px);
      font-weight: 900;
      padding: 12px 30px;
      box-shadow: 0 7px 0 #D69600;
      cursor: pointer;
    }

    .pm-merge-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #D69600; }

    .pm-choices {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 18px);
    }

    .pm-choice-btn {
      height: clamp(72px, 11vh, 96px);
      border: 5px solid #FFFFFF;
      border-radius: 26px;
      background: #FFFFFF;
      color: #2D3436;
      font-family: var(--font-rounded);
      font-size: clamp(30px, 4.4vw, 44px);
      font-weight: 900;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.16);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }

    .pm-choice-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
    }

    .pm-choice-btn.is-correct {
      background: #4ADE80;
      color: #FFFFFF;
      box-shadow: 0 8px 0 #16A34A;
    }

    .pm-choice-btn.is-wrong {
      animation: gentleShake 0.36s ease;
      background: #FEE2E2;
      color: #B91C1C;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    /* Compact Indicator LED (for Shift Register / Decoder / Memory Cells) */
    .toy-mini-led {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 6.4%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 0.55%;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 13;
    }

    .toy-mini-led-bulb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--led-off, #323946);
      transition: background 0.12s ease, box-shadow 0.14s ease, transform 0.14s ease;
    }

    .toy-mini-led.is-on .toy-mini-led-bulb {
      background: var(--led-on, #FFE64D);
      transform: scale(1.08);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.5),
        0 0 18px 6px var(--led-glow, rgba(255, 230, 77, 0.9));
    }

    .toy-mini-led.is-selected {
      box-shadow: 0 0 0 5px #FFD12E, 0 5px 0 rgba(0, 0, 0, 0.25);
    }

    /* Interactive Tap Node (for MUX input toggles & Memory Cell direct tap) */
    .toy-tap-node {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 7.4%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 0.65%;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      z-index: 15;
      transition: transform 0.1s ease;
    }

    .toy-tap-node:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .toy-tap-node-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #3A4252;
      color: #FFFFFF;
      font-size: clamp(11px, 1.4vw, 15px);
      font-weight: 900;
      display: grid;
      place-items: center;
      transition: background 0.14s ease, box-shadow 0.14s ease;
    }

    .toy-tap-node.is-on .toy-tap-node-inner {
      background: var(--led-on, #4ADE80);
      color: #1B3A24;
      box-shadow: 0 0 18px 5px var(--led-glow, rgba(74, 222, 128, 0.85));
    }

    .toy-tap-node.is-selected {
      box-shadow: 0 0 0 6px #FFD12E, 0 6px 0 rgba(0, 0, 0, 0.25);
    }

    /* Action Push Button (for Clock / Memory Write) */
    .toy-action-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 15.5%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 1%;
      box-shadow: 0 9px 0 rgba(0, 0, 0, 0.22);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      z-index: 15;
    }

    .toy-action-cap {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--act-bg, #38BDF8);
      color: #FFFFFF;
      font-size: clamp(12px, 1.5vw, 17px);
      font-weight: 900;
      text-align: center;
      line-height: 1.15;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 0 var(--act-depth, #0284C7);
      transform: translateY(-4px);
      transition: transform 0.07s ease, box-shadow 0.07s ease;
    }

    .toy-action-btn.is-pressed .toy-action-cap {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--act-depth, #0284C7);
    }

    /* Bottom Navigation Bar (Prev / Page Dots / Next) */
    .lb-nav {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 4px;
    }

    .nav-arrow-btn {
      width: clamp(58px, 7vw, 72px);
      height: clamp(58px, 7vw, 72px);
      border: 4px solid #FFFFFF;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      color: #2D3436;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s ease;
      padding: 0;
    }

    .nav-arrow-btn:active,
    .nav-arrow-btn.is-pressed {
      transform: translateY(5px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }

    .nav-arrow-btn.is-disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .lb-dots {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 16px);
      background: rgba(0, 0, 0, 0.16);
      padding: 10px 18px;
      border-radius: 999px;
    }

    .lb-root.is-light-bg .lb-dots {
      background: rgba(59, 46, 0, 0.14);
    }

    .lb-dot {
      width: clamp(16px, 2vw, 20px);
      height: clamp(16px, 2vw, 20px);
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      padding: 0;
      transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, transform 0.15s ease;
    }

    .lb-dot.is-active {
      width: clamp(34px, 4vw, 44px);
      background: #FFFFFF;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
    }

    .lb-root.is-light-bg .lb-dot {
      background: rgba(59, 46, 0, 0.28);
    }
    .lb-root.is-light-bg .lb-dot.is-active {
      background: #3B2E00;
    }

    /* Portrait adjustments for iPad vertical */
    @media (orientation: portrait) {
      .lb-board {
        width: min(94vw, 760px);
      }
      .toy-push-btn {
        width: 19%;
      }
      .toy-led {
        width: 12.2%;
      }
    }

    /* ============================================================
       SHARED CELEBRATION OVERLAY (Big Cracker + Next Button)
       ============================================================ */
    .celeb-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: celebFadeIn 0.22s ease forwards;
    }

    @keyframes celebFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .celeb-card {
      position: relative;
      width: min(92vw, 460px);
      background: #FFFFFF;
      border: 6px solid #FFD12E;
      border-radius: 38px;
      padding: 28px 24px 26px;
      box-shadow: 0 14px 0 #D99B00, 0 24px 48px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      animation: celebPop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes celebPop {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celeb-icons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .celeb-cracker-l { animation: crackerBounce 0.7s ease-in-out infinite alternate; }
    .celeb-cracker-r { transform: scaleX(-1); animation: crackerBounceR 0.7s ease-in-out infinite alternate; }

    @keyframes crackerBounce {
      from { transform: rotate(-10deg) scale(1); }
      to   { transform: rotate(8deg) scale(1.12); }
    }
    @keyframes crackerBounceR {
      from { transform: scaleX(-1) rotate(-10deg) scale(1); }
      to   { transform: scaleX(-1) rotate(8deg) scale(1.12); }
    }

    .celeb-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 900;
      color: #FF5722;
      letter-spacing: 0.08em;
    }

    .celeb-sub {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 22px);
      font-weight: 900;
      color: #334155;
    }

    .celeb-next-btn {
      margin-top: 6px;
      width: 100%;
      max-width: 320px;
      height: 74px;
      border: 5px solid #FFFFFF;
      border-radius: 999px;
      background: #22C55E;
      color: #FFFFFF;
      font-family: var(--font-rounded);
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 900;
      letter-spacing: 0.06em;
      box-shadow: 0 9px 0 #15803D, 0 14px 20px rgba(21, 128, 61, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .celeb-next-btn:active {
      transform: translateY(6px);
      box-shadow: 0 3px 0 #15803D;
    }

    /* ============================================================
       COLOR MIX V2: BIG VISUAL TARGET + BOWL SIDE-BY-SIDE
       ============================================================ */
    .cm-compare-row {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vw, 34px);
      flex-wrap: nowrap;
    }

    .cm-target-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .cm-big-circle {
      width: clamp(148px, 26vh, 225px);
      height: clamp(148px, 26vh, 225px);
      border-radius: 50%;
      background: #FFFFFF;
      padding: 10px;
      box-shadow: 0 11px 0 rgba(0, 0, 0, 0.16), 0 18px 30px rgba(0, 0, 0, 0.16);
      position: relative;
      display: grid;
      place-items: center;
    }

    .cm-big-circle.is-target {
      border: 6px dashed #FFD12E;
      padding: 8px;
    }

    .cm-big-circle.is-splash {
      animation: cardBoing 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cm-tag-pill {
      background: rgba(255, 255, 255, 0.94);
      color: #2D3436;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cm-skip-btn {
      border: 3px solid #FFFFFF;
      background: rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
      font-family: var(--font-rounded);
      font-size: 13px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .cm-arrow-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    /* ============================================================
       GAME 6: PITCH QUIZ (ぜったい おんかん)
       ============================================================ */
    .pq-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + var(--safe-top)) calc(16px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left));
      gap: 8px;
    }

    .pq-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    .pq-listen-btn {
      position: relative;
      width: clamp(118px, 18vh, 152px);
      height: clamp(118px, 18vh, 152px);
      border: 6px solid #FFFFFF;
      border-radius: 50%;
      background: #FFD12E;
      color: #4D3300;
      box-shadow: 0 10px 0 #D69600, 0 18px 28px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      font-family: var(--font-rounded);
      font-size: clamp(14px, 1.8vw, 17px);
      font-weight: 900;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .pq-listen-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #D69600;
    }

    .pq-listen-btn.is-playing {
      animation: pqPulse 0.65s ease-in-out infinite alternate;
      box-shadow: 0 0 0 12px rgba(255, 209, 46, 0.42), 0 10px 0 #D69600;
    }

    @keyframes pqPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.09); }
    }

    .pq-phase-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #1E293B;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.14);
    }

    .pq-piano-locked {
      opacity: 0.55;
      pointer-events: none;
      filter: saturate(0.7);
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    .piano-white-key.is-wrong-key {
      background: #FEE2E2 !important;
      animation: gentleShake 0.35s ease;
    }

    .piano-black-key.is-wrong-key {
      background: #991B1B !important;
    }

    /* ============================================================
       GAME 7: GEAR MACHINE (はぐるま マシン)
       ============================================================ */
    .gm-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--safe-top)) calc(16px + var(--safe-right)) calc(14px + var(--safe-bottom)) calc(16px + var(--safe-left));
      gap: 8px;
    }

    .gm-viewport {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gm-board {
      position: relative;
      width: min(94vw, 960px, calc(62dvh * 1.875));
      aspect-ratio: 900 / 480;
      background: rgba(255, 255, 255, 0.14);
      border: 5px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.14), 0 12px 26px rgba(0, 0, 0, 0.16);
      overflow: hidden;
    }

    .gm-board.is-jammed {
      animation: gentleShake 0.36s ease;
      border-color: #FF6B6B;
    }

    .gm-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .gm-peg-hit {
      cursor: pointer;
      fill: transparent;
    }

    .gm-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.6vw, 16px);
      flex-wrap: wrap;
      z-index: 15;
    }

    .gm-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: clamp(54px, 7.5vh, 66px);
      padding: 0 clamp(14px, 2vw, 22px);
      border: 4px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
      font-family: var(--font-rounded);
      font-size: clamp(14px, 1.7vw, 17px);
      font-weight: 900;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.16);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.1s ease;
    }

    .gm-tool-btn.is-active {
      background: #FFFFFF;
      color: #1E293B;
      border-color: #FFD12E;
      box-shadow: 0 0 0 4px #FFD12E, 0 6px 0 rgba(0, 0, 0, 0.16);
      transform: translateY(-2px);
    }

    .gm-tool-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ==================== HOME MENU SCREEN ==================== -->
    <section id="home-screen" class="screen" aria-label="ゲームメニュー">
      <div class="home-bg-decor" aria-hidden="true">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
        <div class="bg-blob bg-blob-4"></div>
      </div>

      <header class="home-header">
        <div class="brand-badge">
          <div class="brand-logo" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <circle cx="14" cy="14" r="9" fill="#FFD12E" stroke="#FFFFFF" stroke-width="3"/>
              <circle cx="11" cy="11" r="2.5" fill="#FFFFFF" opacity="0.8"/>
            </svg>
          </div>
          <div>
            <span class="brand-sub">KIDS PLAYGROUND</span>
            <h1 class="brand-title">ちいく あそびば</h1>
          </div>
        </div>

        <button class="toy-icon-btn js-sound-toggle" type="button" aria-label="おとの オン・オフ">
          <svg class="icon-sound-on" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg class="icon-sound-off" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </header>

      <main class="home-main">
        <p class="home-prompt">どの あそびで あそぶ？</p>
        <noscript>
          <div class="noscript-banner">
            JavaScript（じゃばすくりぷと）が オフに なっているよ。<br />
            iPad の「設定」→「Safari」→「詳細」から JavaScript をオンにしてね！
          </div>
        </noscript>
        <div id="game-grid" class="game-grid"></div>
      </main>

      <footer class="home-footer">
        iPad マルチタッチたいおう ・ おとが でるよ
      </footer>
    </section>

    <!-- ==================== GAME SHELL SCREEN ==================== -->
    <section id="game-screen" class="screen is-hidden" aria-label="ゲーム画面">
      <div class="game-topbar">
        <button id="close-game-btn" class="close-game-btn" type="button" aria-label="メニューに もどる">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>

        <button class="toy-icon-btn js-sound-toggle" type="button" aria-label="おとの オン・オフ">
          <svg class="icon-sound-on" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg class="icon-sound-off" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </div>

      <div id="game-mount"></div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      /* =========================================================================
         1. HIGH-QUALITY WEB AUDIO SOUND ENGINE
            (Tactile toy clicks + warm marimba/kalimba harmonics + room reverb)
         ========================================================================= */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.dryBus = null;
          this.wetBus = null;
          this.noiseBuffer = null;
          this.muted = false;
          this.unlocked = false;
        }

        ensureContext() {
          if (this.ctx) {
            if (this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return this.ctx;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;

          const ctx = new AudioCtx();
          this.ctx = ctx;

          // Master dynamics compressor for warm, clean, non-clipping output
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 18;
          comp.ratio.value = 4;
          comp.attack.value = 0.005;
          comp.release.value = 0.16;

          const master = ctx.createGain();
          master.gain.value = this.muted ? 0 : 0.9;

          const dryBus = ctx.createGain();
          dryBus.gain.value = 0.85;

          const wetBus = ctx.createGain();
          wetBus.gain.value = 0.28;

          // Procedural warm studio room reverb (impulse response)
          const convolver = ctx.createConvolver();
          convolver.buffer = this.createReverbIR(ctx, 1.15, 2.8);

          dryBus.connect(comp);
          wetBus.connect(convolver);
          convolver.connect(comp);
          comp.connect(master);
          master.connect(ctx.destination);

          this.master = master;
          this.dryBus = dryBus;
          this.wetBus = wetBus;
          this.noiseBuffer = this.createNoiseBuffer(ctx, 0.5);

          return ctx;
        }

        unlock() {
          const ctx = this.ensureContext();
          if (!ctx || this.unlocked) return;
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          // Play 1-sample silent buffer to unlock iOS Safari audio
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          try {
            src.start(0);
            this.unlocked = true;
          } catch (_) {}
        }

        createNoiseBuffer(ctx, durationSec) {
          const length = Math.floor(ctx.sampleRate * durationSec);
          const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buffer;
        }

        createReverbIR(ctx, durationSec, decay) {
          const rate = ctx.sampleRate;
          const length = Math.floor(rate * durationSec);
          const ir = ctx.createBuffer(2, length, rate);
          for (let ch = 0; ch < 2; ch++) {
            const data = ir.getChannelData(ch);
            let lp = 0;
            for (let i = 0; i < length; i++) {
              const t = i / length;
              const env = Math.pow(1 - t, decay);
              // Gentle low-pass smoothing for warm wooden room feel
              const white = Math.random() * 2 - 1;
              lp = lp * 0.72 + white * 0.28;
              data[i] = lp * env;
            }
          }
          return ir;
        }

        setMuted(muted) {
          this.muted = muted;
          if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(muted ? 0 : 0.9, this.ctx.currentTime, 0.02);
          }
        }

        toggleMute() {
          this.setMuted(!this.muted);
          return this.muted;
        }

        /** Warm Marimba / Kalimba single note with rich overtones */
        playMarimbaNote(freq, startTime, duration = 0.55, volume = 0.24, brightness = 1.0) {
          const ctx = this.ctx;
          if (!ctx || this.muted) return;

          const out = ctx.createGain();
          out.gain.setValueAtTime(0.0001, startTime);
          out.gain.linearRampToValueAtTime(volume, startTime + 0.008);
          out.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          // Fundamental (warm triangle + sine blend)
          const osc1 = ctx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, startTime);

          const osc1b = ctx.createOscillator();
          osc1b.type = 'triangle';
          osc1b.frequency.setValueAtTime(freq * 1.002, startTime); // subtle warmth detune
          const g1b = ctx.createGain();
          g1b.gain.value = 0.35;

          // 2nd harmonic (soft wooden body)
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2, startTime);
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.18 * brightness, startTime);
          g2.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.45);

          // 4th harmonic (mallet strike ping)
          const osc4 = ctx.createOscillator();
          osc4.type = 'sine';
          osc4.frequency.setValueAtTime(freq * 4, startTime);
          const g4 = ctx.createGain();
          g4.gain.setValueAtTime(0.09 * brightness, startTime);
          g4.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.07);

          osc1.connect(out);
          osc1b.connect(g1b); g1b.connect(out);
          osc2.connect(g2);   g2.connect(out);
          osc4.connect(g4);   g4.connect(out);

          out.connect(this.dryBus);
          out.connect(this.wetBus);

          [osc1, osc1b, osc2, osc4].forEach(osc => {
            osc.start(startTime);
            osc.stop(startTime + duration + 0.04);
          });
        }

        /** Tactile toy push button DOWN sound (plastic click + resonant body thump) */
        playButtonDown(variant = 'yellow') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // 1. Crisp micro-switch click (bandpass filtered noise burst)
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(variant === 'red' ? 2100 : 2500, now);
          bp.Q.value = 2.4;

          const clickGain = ctx.createGain();
          clickGain.gain.setValueAtTime(0.28, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);

          noise.connect(bp);
          bp.connect(clickGain);
          clickGain.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.03);

          // 2. Soft hollow plastic pop (pitched sine drop)
          const pop = ctx.createOscillator();
          pop.type = 'sine';
          const baseFreq = variant === 'red' ? 185 : 225;
          pop.frequency.setValueAtTime(baseFreq, now);
          pop.frequency.exponentialRampToValueAtTime(baseFreq * 0.44, now + 0.055);

          const popGain = ctx.createGain();
          popGain.gain.setValueAtTime(0.26, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          pop.connect(popGain);
          popGain.connect(this.dryBus);
          pop.start(now);
          pop.stop(now + 0.07);
        }

        /** Tactile toy push button UP (release) sound */
        playButtonUp(variant = 'yellow') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          const startFreq = variant === 'red' ? 240 : 285;
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(startFreq * 1.32, now + 0.032);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.038);

          osc.connect(g);
          g.connect(this.dryBus);
          osc.start(now);
          osc.stop(now + 0.045);
        }

        /** Lamp ON harmonic celebration tailored per circuit stage (C major pentatonic) */
        playLampOn(stageId) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Musical chord voicings (all consonant in C major pentatonic)
          const chords = {
            wire:  [523.25, 783.99],                   // C5, G5
            not:   [587.33, 880.00],                   // D5, A5
            or:    [659.25, 783.99, 1046.50],          // E5, G5, C6
            and:   [523.25, 659.25, 783.99, 1046.50],  // C5, E5, G5, C6 (big reward!)
            xor:   [440.00, 659.25, 880.00],           // A4, E5, A5
            latch: [523.25, 659.25, 783.99, 1174.66],  // C5, E5, G5, D6 (magical harp)
          };

          const notes = chords[stageId] || chords.wire;
          const step = stageId === 'latch' ? 0.055 : (stageId === 'and' ? 0.038 : 0.025);
          const dur = stageId === 'latch' ? 0.9 : 0.62;
          const vol = 0.21 / Math.sqrt(notes.length * 0.65);

          notes.forEach((freq, i) => {
            this.playMarimbaNote(freq, now + i * step, dur, vol, stageId === 'and' ? 1.3 : 1.0);
          });
        }

        /** Lamp OFF gentle rounded sound */
        playLampOff(isLatchReset = false) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          if (isLatchReset) {
            // Soft downward 2-note release for LATCH RESET
            this.playMarimbaNote(587.33, now, 0.26, 0.14, 0.5);
            this.playMarimbaNote(392.00, now + 0.065, 0.36, 0.16, 0.45);
          } else {
            // Subtle muted wooden drop
            this.playMarimbaNote(392.00, now, 0.2, 0.08, 0.35);
          }
        }

        /** Page turn sound (gentle paper whoosh + soft woodblock) */
        playPageTurn(direction = 1) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Soft paper sweep
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(direction > 0 ? 700 : 1200, now);
          filter.frequency.exponentialRampToValueAtTime(direction > 0 ? 1500 : 650, now + 0.12);
          filter.Q.value = 1.2;

          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.001, now);
          ng.gain.linearRampToValueAtTime(0.11, now + 0.03);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          noise.connect(filter);
          filter.connect(ng);
          ng.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.16);

          // Light woodblock tap
          const pitch = direction > 0 ? 659.25 : 523.25;
          this.playMarimbaNote(pitch, now + 0.02, 0.18, 0.14, 0.7);
        }

        /** Menu launch chime */
        playMenuSelect() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((f, i) => {
            this.playMarimbaNote(f, now + i * 0.055, 0.42, 0.19, 1.1);
          });
        }

        /** Playful boing for Coming Soon cards */
        playBoing() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(460, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.2);
          osc.frequency.exponentialRampToValueAtTime(410, now + 0.28);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.22, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

          osc.connect(g);
          g.connect(this.dryBus);
          g.connect(this.wetBus);
          osc.start(now);
          osc.stop(now + 0.36);
        }

        /** Tactile mechanical rocker switch snap (ON = brighter snap, OFF = deeper clack) */
        playRockerSwitch(isOn, variant = 'red') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Crisp double-click plastic snap
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(isOn ? 2800 : 1850, now);
          bp.Q.value = 3.0;

          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.32, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

          noise.connect(bp);
          bp.connect(ng);
          ng.connect(this.dryBus);
          noise.start(now);
          noise.stop(now + 0.032);

          // Resonant rocker body clack
          const body = ctx.createOscillator();
          body.type = 'triangle';
          const startF = isOn ? (variant === 'red' ? 310 : 350) : (variant === 'red' ? 230 : 260);
          const endF = isOn ? startF * 1.45 : startF * 0.62;
          body.frequency.setValueAtTime(startF, now);
          body.frequency.exponentialRampToValueAtTime(endF, now + 0.048);

          const bg = ctx.createGain();
          bg.gain.setValueAtTime(0.22, now);
          bg.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

          body.connect(bg);
          bg.connect(this.dryBus);
          body.start(now);
          body.stop(now + 0.06);
        }

        /** Shift register step chime (scales nicely with lit bits) */
        playShiftStep(litCount = 1) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const scale = [392.0, 523.25, 659.25, 783.99, 1046.5];
          const freq = scale[Math.min(scale.length - 1, Math.max(0, litCount))];
          this.playMarimbaNote(freq, now, 0.34, 0.2, 1.05);
        }

        /** Decoder / Mux selection pitch (4 distinct pentatonic notes for 0..3) */
        playSlotTone(slotIndex) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const tones = [523.25, 587.33, 659.25, 783.99]; // C5, D5, E5, G5
          const f = tones[slotIndex % 4];
          this.playMarimbaNote(f, now, 0.45, 0.2, 1.0);
        }

        /** Memory write confirmation chime */
        playMemoryWrite(isOn) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          if (isOn) {
            this.playMarimbaNote(659.25, now, 0.35, 0.2, 1.15);
            this.playMarimbaNote(987.77, now + 0.05, 0.5, 0.2, 1.2);
          } else {
            this.playMarimbaNote(523.25, now, 0.28, 0.16, 0.65);
            this.playMarimbaNote(392.00, now + 0.055, 0.36, 0.16, 0.55);
          }
        }

        /** Multi-instrument synthesizer for Sound Magic (marimba / piano / sparkle / drum) */
        playInstrumentNote(instrument, freq, index = 0) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          if (instrument === 'marimba') {
            this.playMarimbaNote(freq, now, 0.65, 0.28, 1.15);
            return;
          }

          if (instrument === 'piano') {
            // Warm Rhodes-like electric piano (fundamental + 2nd + 3rd harmonic with soft bell attack)
            const out = ctx.createGain();
            out.gain.setValueAtTime(0.0001, now);
            out.gain.linearRampToValueAtTime(0.24, now + 0.008);
            out.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);

            [1, 2, 3].forEach((mult, idx) => {
              const osc = ctx.createOscillator();
              osc.type = idx === 0 ? 'triangle' : 'sine';
              osc.frequency.setValueAtTime(freq * mult, now);
              const g = ctx.createGain();
              g.gain.value = idx === 0 ? 0.7 : (idx === 1 ? 0.22 : 0.08);
              osc.connect(g);
              g.connect(out);
              osc.start(now);
              osc.stop(now + 1.2);
            });
            out.connect(this.dryBus);
            out.connect(this.wetBus);
            return;
          }

          if (instrument === 'sparkle') {
            // Music box / Celesta bell (crystal clear high overtone)
            const out = ctx.createGain();
            out.gain.setValueAtTime(0.0001, now);
            out.gain.linearRampToValueAtTime(0.22, now + 0.005);
            out.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);

            const o1 = ctx.createOscillator();
            o1.type = 'sine';
            o1.frequency.setValueAtTime(freq * 2, now);
            const o2 = ctx.createOscillator();
            o2.type = 'sine';
            o2.frequency.setValueAtTime(freq * 4.01, now);
            const g2 = ctx.createGain();
            g2.gain.setValueAtTime(0.18, now);
            g2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            o1.connect(out);
            o2.connect(g2); g2.connect(out);
            out.connect(this.dryBus);
            out.connect(this.wetBus);
            o1.start(now); o2.start(now);
            o1.stop(now + 1.4); o2.stop(now + 0.4);
            return;
          }

          // 'drum' — playful pitched percussions (tom / bongo / woodblock / shaker)
          const pitch = 110 + index * 48;
          const osc = ctx.createOscillator();
          osc.type = index % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(pitch * 1.7, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 0.65, now + 0.14);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.32, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          osc.connect(g);
          g.connect(this.dryBus);
          g.connect(this.wetBus);
          osc.start(now);
          osc.stop(now + 0.25);

          // Crisp rim / shaker accent
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(1400 + index * 380, now);
          bp.Q.value = 2.0;
          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.18, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          noise.connect(bp); bp.connect(ng); ng.connect(this.dryBus);
          noise.start(now); noise.stop(now + 0.065);
        }

        /** Liquid splash plop for Color Mix */
        playSplash(pitchShift = 0) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const base = 320 + pitchShift * 55;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(base * 0.72, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.65, now + 0.11);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.24, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc.connect(g);
          g.connect(this.dryBus);
          g.connect(this.wetBus);
          osc.start(now);
          osc.stop(now + 0.19);
        }

        /** Happy celebratory fanfare for Color Mix mission / Plus Magic correct answer */
        playSuccessFanfare() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            this.playMarimbaNote(f, now + i * 0.075, 0.55, 0.22, 1.25);
          });
        }

        /** Gentle, friendly nudge (never harsh buzzer) */
        playGentleNudge() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          this.playMarimbaNote(349.23, now, 0.24, 0.15, 0.5);
          this.playMarimbaNote(329.63, now + 0.08, 0.28, 0.15, 0.45);
        }

        /** Counting pip that climbs up a happy major scale */
        playCountPip(stepIndex) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const scale = [261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];
          const freq = scale[stepIndex % scale.length];
          this.playMarimbaNote(freq, now, 0.32, 0.22, 1.05);
        }

        /** Party cracker POP + sparkle fanfare */
        playCrackerPop() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;

          // Crisp party popper burst
          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(1600, now);
          bp.frequency.exponentialRampToValueAtTime(520, now + 0.09);
          bp.Q.value = 1.4;

          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.42, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          noise.connect(bp); bp.connect(ng); ng.connect(this.dryBus); ng.connect(this.wetBus);
          noise.start(now); noise.stop(now + 0.12);

          // Pop thump
          const pop = ctx.createOscillator();
          pop.type = 'sine';
          pop.frequency.setValueAtTime(260, now);
          pop.frequency.exponentialRampToValueAtTime(70, now + 0.075);
          const pg = ctx.createGain();
          pg.gain.setValueAtTime(0.32, now);
          pg.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
          pop.connect(pg); pg.connect(this.dryBus);
          pop.start(now); pop.stop(now + 0.09);

          // Joyful celebratory chord cascade
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
            this.playMarimbaNote(f, now + 0.06 + i * 0.055, 0.72, 0.21, 1.3);
          });
        }

        /** Mechanical gear snap-in sound */
        playGearSnap(size = 'M') {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const pitch = size === 'S' ? 520 : (size === 'L' ? 280 : 390);
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(pitch * 0.75, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.055);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.24, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          osc.connect(g); g.connect(this.dryBus);
          osc.start(now); osc.stop(now + 0.085);
          this.playButtonDown('yellow');
        }

        /** Soft gear pop-off sound */
        playGearRemove() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.07);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.18, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(g); g.connect(this.dryBus);
          osc.start(now); osc.stop(now + 0.09);
        }
